<!--
  WeClass 課綱單元課程包 v3.1（只做官網 Find Your Course 第三張卡：Learn by Goal）
  從官網外連進入的課程站：課程總覽＋依學習目標找課（入口）、11 個課程方案頁。
  視覺依 Figma《維課教育｜2026網頁設計》與《WeClass Brand Guidelines Book V01》。
  官網：https://weclass.tw/（左上角 Logo 與「回官網」）
  網址：#（課綱單元課程包：依學習目標找單元）、#all（全部課程方案）、#p1～#p11（方案頁）、#p1.3（方案頁並打開第 3 單元）
-->
<style id="design-tokens">
/* Layout: Figma 02 課程介紹 / 08 課程彈窗 —— 奶油底首屏、斜切皺紙色帶分段、傾斜白卡、課程彈窗 */
:root {
  color-scheme: light;
  /* 品牌色（Figma 變數組「WeClass / 品牌色彩」） */
  --teal: #1D4C58;        /* teal/600 */
  --ink: #1C4D59;         /* 文字 */
  --mint: #87CCC8;        /* mint/500，導覽選中 */
  --mint-light: #B1DBCF;  /* mint/200，相框 */
  --mint-pale: #E1F6F4;
  --orange: #F08419;      /* orange/600，按鈕 */
  --peach: #FFDBA9;       /* 重點底色、星芒 */
  --yellow: #FFE2A3;      /* 便條卡 */
  --cream: #FDEFDF;       /* 頁面底色 */
  --grey-text: #636363;   /* 卡片說明文字（Figma #757575 加深以符合對比） */
  --white: #FFFFFF;
  /* 字體（Figma 文字樣式） */
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-en: "Poppins", "Noto Sans TC", sans-serif;
  --shadow-card: 0 13px 20px 6px rgba(0, 0, 0, 0.12);
  /* 照片多邊形外框（Figma「圖片 / 課程理念介紹」的形狀） */
  --frame: polygon(20.1% 0%, 0% 18.3%, 0% 73.2%, 3.9% 89.4%, 42.7% 100%, 91.8% 91.5%, 100% 75.4%, 97.5% 18.3%, 93.7% 4%);
}
</style>
<style id="brand-assets">
/* 品牌素材（全部內嵌）：Logo、手寫標題、星芒筆刷、皺紙紋理、角色、課程照片 */
:root {
  {{ASSET_VARS}}
}
</style>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f-zh); font-weight: 500; font-size: 16px; line-height: 1.6; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 頁首 ── */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--cream); }
.site-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 104px; }
.logo { width: 200px; height: 58px; background: var(--logo) left center / contain no-repeat; flex: none; }
/* 導覽列：依 Figma 02 課程介紹 Desktop——粗體深綠字、加寬字距、選中為薄荷綠膠囊 */
.nav { display: flex; gap: 10px; align-items: center; }
.nav a { text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: 0.14em; color: var(--teal); padding: 7px 16px; border-radius: 999px; white-space: nowrap; transition: background .2s; }
.nav a:hover { background: var(--mint-pale); }
.nav a[aria-current="page"] { background: var(--mint); }
.nav a.official span { font-family: var(--f-en); font-size: 13px; margin-left: 2px; }

/* ── 手機漢堡選單 ── */
.burger { display: none; width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--teal); padding: 0; flex: none; position: relative; }
.burger span { position: absolute; left: 13px; width: 20px; height: 2.5px; border-radius: 2px; background: var(--white); transition: transform .25s, opacity .2s, top .25s; }
.burger span:nth-child(1) { top: 15px; } .burger span:nth-child(2) { top: 22px; } .burger span:nth-child(3) { top: 29px; }
.burger[aria-expanded="true"] span:nth-child(1) { top: 22px; transform: rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { top: 22px; transform: rotate(-45deg); }
.mnav { position: absolute; left: 0; right: 0; top: 100%; background: var(--cream); box-shadow: 0 18px 24px -12px rgba(0, 0, 0, .18); max-height: calc(100dvh - 66px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 6px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); border-top: 2px dashed #EBD9C2; }
.mnav .main { display: grid; gap: 6px; margin: 10px 0 14px; }
.mnav .main a { display: flex; justify-content: space-between; align-items: center; text-decoration: none; font-weight: 900; font-size: 18px; letter-spacing: 0.06em; padding: 12px 16px; border-radius: 14px; background: var(--white); }
.mnav .main a[aria-current="page"] { background: var(--mint); }
.mnav .main a.official { background: var(--teal); color: var(--white); }
.mnav h3 { font-weight: 900; font-size: 14px; letter-spacing: 0.08em; color: var(--teal); margin: 14px 4px 8px; display: flex; gap: 8px; align-items: baseline; }
.mnav h3 small { font-weight: 700; font-size: 12px; color: var(--ink); opacity: .75; }
.mnav ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mnav ul a { display: block; text-decoration: none; font-weight: 700; font-size: 14.5px; letter-spacing: 0.04em; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .65); line-height: 1.35; }
.mnav ul a[aria-current="page"] { background: var(--teal); color: var(--white); }

/* ── 共用：標題組、膠囊、按鈕 ── */
.tgroup .en { font-family: var(--f-en); font-weight: 900; font-size: clamp(38px, 5vw, 56px); line-height: 1; color: var(--teal); margin: 0 0 14px; letter-spacing: -0.01em; }
.tgroup h2 { font-weight: 900; font-size: clamp(24px, 2.6vw, 30px); line-height: 1.3; margin: 0 0 16px; color: var(--teal); }
.tgroup p.d { font-size: 16px; letter-spacing: 0.1em; line-height: 1.75; margin: 0; max-width: 32em; }
.on-teal .tgroup .en { color: var(--white); }
.on-teal .tgroup h2 { color: var(--mint); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; padding: 5px 16px; }
.pill.teal { background: var(--teal); color: var(--white); }
.pill.white { background: var(--white); color: var(--ink); }
.pill.mint { background: var(--mint); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; font-weight: 700; font-size: 17px; letter-spacing: 0.06em; padding: 13px 28px; text-decoration: none; transition: transform .2s, background .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.orange { background: var(--orange); color: var(--ink); box-shadow: 0 8px 18px -8px rgba(240, 132, 25, .8); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--teal); }
.on-teal .btn.line { color: var(--white); box-shadow: inset 0 0 0 2px var(--white); }

/* ── 皺紙色帶 ── */
.band { position: relative; z-index: 3; }
.band.mint { background: var(--mint) var(--tx-mint) center / 768px auto; clip-path: polygon(0 34px, 100% 0, 100% 100%, 0 100%); margin-top: -34px; }
.band.peach { background: var(--peach) var(--tx-peach) center / 768px auto; clip-path: polygon(0 70px, 100% 0, 100% calc(100% - 50px), 0 100%); margin-top: -70px; }
.band.teal { background: var(--teal) var(--tx-teal) center / 768px auto; clip-path: polygon(0 0, 100% 56px, 100% 100%, 0 100%); color: var(--white); }
.band, .hero { overflow: hidden; }
/* 色帶相接：深綠區塊往上疊，避免露出米色楔形縫 */
.band + .band.teal { margin-top: -80px; clip-path: polygon(0 30px, 100% 0, 100% 100%, 0 100%); }
.band + .band.teal .wrap { padding-top: 130px; }
.band.peach + .band.teal .wrap { padding-top: 140px; }

/* ── 首屏（v2.1：縮小高度與插圖） ── */
.hero { position: relative; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); align-items: center; min-height: 380px; }
.star { position: absolute; background: center / contain no-repeat; pointer-events: none; }
.star.s1 { width: 300px; aspect-ratio: 691 / 472; left: -30px; top: 16px; background-image: var(--star1); }
.star.s2 { width: 340px; aspect-ratio: 762 / 520; right: -40px; top: 50px; background-image: var(--star2); }
.hero-copy { position: relative; z-index: 2; padding: 26px 0 70px; }
.lettering { width: min(250px, 64vw); aspect-ratio: 408 / 176; background: left center / contain no-repeat; margin-bottom: 12px; }
.lettering.learn { background-image: var(--letter-learn); }
.lettering.create { background-image: var(--letter-create); aspect-ratio: 410 / 165; }
.hero h1 { font-weight: 900; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.25; margin: 10px 0; color: var(--teal); }
.hero-copy p.d { letter-spacing: 0.08em; line-height: 1.8; margin: 0 0 20px; max-width: 34em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-girl { position: absolute; right: 2%; bottom: -66px; width: min(480px, 38vw); z-index: 1; }
.hero-cast { position: relative; z-index: 1; width: 100%; max-width: 320px; aspect-ratio: 900 / 560; background: var(--cast-group) center / contain no-repeat; justify-self: end; margin-bottom: 30px; }
.hero-framed { position: relative; z-index: 1; justify-self: end; width: 100%; max-width: 440px; margin-bottom: 50px; }
.crumb { font-size: 14px; letter-spacing: 0.08em; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb a { text-decoration: none; border-bottom: 1px solid currentColor; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 4px; }
.stats .pill { font-size: 14px; padding: 4px 14px; }
.hl { background: linear-gradient(transparent 58%, var(--peach) 58%); font-weight: 700; }

/* 多邊形相框 */
.framed { position: relative; transform: rotate(1.5deg); aspect-ratio: 461 / 287; }
.framed::before { content: ""; position: absolute; inset: -7px; background: var(--white); clip-path: var(--frame); }
.framed img { position: relative; width: 100%; height: 100%; object-fit: cover; clip-path: var(--frame); }

/* ── 課程列表＋找課（總覽） ── */
.courses .wrap { padding-block: 84px 90px; }
.courses { scroll-margin-top: 30px; }
.courses-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 24px; margin-bottom: 22px; }
.courses-head .tgroup .en { font-size: clamp(34px, 4vw, 46px); margin-bottom: 8px; }
.courses-head .tgroup h2 { margin-bottom: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.filter-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--teal); color: var(--white); border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
.filter-btn .cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--orange); color: var(--ink); font-family: var(--f-en); font-size: 12px; padding: 0 5px; }
.filter-btn .arr { transition: transform .2s; }
.filter-btn[aria-expanded="true"] .arr { transform: rotate(180deg); }
.tag-panel { background: var(--white); border-radius: 18px; box-shadow: var(--shadow-card); padding: 18px 20px 16px; margin-bottom: 20px; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 12px 22px; align-items: start; }
.tag-panel .side { display: grid; gap: 10px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tab { border: 0; background: var(--cream); border-radius: 12px; padding: 9px 6px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; white-space: nowrap; text-align: left; padding-left: 12px; }
.tab[aria-selected="true"] { background: var(--teal); color: var(--white); }
.tab .cnt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; font-family: var(--f-en); font-size: 11px; background: var(--orange); color: var(--ink); margin-left: 4px; padding: 0 4px; }
.search { display: flex; align-items: center; gap: 8px; border: 2px solid var(--mint-light); border-radius: 999px; padding: 6px 14px; }
.search input { border: 0; outline: 0; font: inherit; font-size: 15px; flex: 1; min-width: 0; background: transparent; color: var(--ink); letter-spacing: 0.04em; }
.search input::placeholder { color: #6E8388; }
.tag-list { display: flex; flex-wrap: wrap; gap: 7px; max-height: 168px; overflow-y: auto; padding: 2px; scrollbar-width: thin; align-content: flex-start; }
.tag { border: 1.5px solid #EBD9C2; background: var(--white); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; transition: background .15s; }
.tag:hover { background: var(--cream); }

.tag .n { font-family: var(--f-en); font-size: 11px; opacity: .65; margin-left: 4px; }
.empty-hint { font-size: 14px; color: #5E7378; padding: 4px 2px; margin: 0; }
.seg { display: inline-flex; background: rgba(255, 255, 255, .7); padding: 4px; border-radius: 999px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.seg button[aria-pressed="true"] { background: var(--white); box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
.summary { font-weight: 700; letter-spacing: 0.06em; font-size: 15px; margin: 0; }
.summary b { font-family: var(--f-en); font-size: 20px; color: var(--teal); margin: 0 2px; }
.picked { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }

.picked .chip i { font-style: normal; font-size: 11px; opacity: .75; }

/* 方案卡：大照片＋精簡文字，一排 4 張 */
.pkg-group + .pkg-group { margin-top: 44px; }
.pkg-group h3.gt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-weight: 900; font-size: 22px; margin: 0 0 20px; color: var(--teal); }
.pkg-group h3.gt small { font-weight: 700; font-size: 14px; color: var(--ink); letter-spacing: 0.06em; }
.pkgs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 24px; }
.pkg { position: relative; background: var(--white); border-radius: 18px; box-shadow: 0 10px 18px 2px rgba(0, 0, 0, .1); padding: 12px 12px 16px; display: flex; flex-direction: column; transition: transform .25s ease, box-shadow .25s; text-decoration: none; }
.pkg:nth-child(odd) { transform: rotate(-1deg); }
.pkg:nth-child(even) { transform: rotate(1deg); }
.pkg:hover { transform: rotate(0) translateY(-5px); box-shadow: 0 18px 26px 4px rgba(0, 0, 0, .13); }
.photo { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--mint-light); }
.photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.pkg:hover .photo img { transform: scale(1.04); }
.photo .lv { position: absolute; left: 10px; bottom: 10px; background: var(--teal); color: var(--white); font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; border-radius: 8px; padding: 3px 10px; }
.pkg .body { padding: 14px 6px 0; display: flex; flex-direction: column; flex: 1; }
.pkg h4 { font-weight: 900; font-size: 19px; line-height: 1.35; color: var(--teal); margin: 0 0 6px; }
.pkg p.d { color: var(--grey-text); letter-spacing: 0.05em; line-height: 1.6; margin: 0 0 12px; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pkg .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; }
.time { font-weight: 700; font-size: 13px; color: var(--ink); background: var(--mint-pale); border-radius: 999px; padding: 4px 11px; }
.go { text-decoration: none; background: var(--orange); color: var(--ink); border-radius: 999px; font-weight: 700; font-size: 14px; padding: 6px 15px; }
.match { background: var(--cream); border-radius: 12px; padding: 9px 10px 10px; margin: 0 0 12px; }
.match .mh { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; margin: 0 0 6px; }
.match .mh b { font-family: var(--f-en); color: var(--teal); }
.match ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.match a { display: inline-block; background: var(--white); border-radius: 999px; padding: 2px 10px; font-size: 13px; text-decoration: none; letter-spacing: 0.03em; }
.match a:hover { background: var(--mint); }
.badge { position: absolute; top: -10px; right: 14px; z-index: 2; background: var(--orange); color: var(--ink); font-weight: 700; font-size: 12.5px; border-radius: 9px; padding: 4px 10px; transform: rotate(3deg); letter-spacing: 0.06em; }
.no-result { background: var(--white); border-radius: 18px; padding: 34px 30px; text-align: center; box-shadow: var(--shadow-card); }
.no-result .char { width: 100px; height: 100px; margin: 0 auto 10px; background: var(--char-max) center / contain no-repeat; }

/* ── 方案頁：簡介、單元卡、便條卡 ── */
.intro .wrap { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 56px; align-items: center; padding-block: 90px 80px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.units .wrap, .outcomes .wrap { padding-block: 120px 120px; position: relative; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px; }
.ozzi { width: 120px; aspect-ratio: 378 / 375; background: var(--ozzi-mag) center / contain no-repeat; flex: none; margin-right: 20px; }
.blob { position: absolute; width: 120px; z-index: 0; pointer-events: none; }
.blob path { fill: var(--mint); }
.cards { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 28px; }
.card { background: var(--white); border-radius: 18px; box-shadow: 0 10px 18px 2px rgba(0, 0, 0, .1); padding: 14px 14px 20px; display: flex; flex-direction: column; transition: transform .25s ease, box-shadow .25s; }
.card:nth-child(3n+1) { transform: rotate(-1.5deg); }
.card:nth-child(3n+2) { transform: rotate(0.8deg) translateY(-6px); }
.card:nth-child(3n) { transform: rotate(1.6deg) translateY(8px); }
.card:hover { transform: rotate(0) translateY(-5px); }
.card .photo .lv { font-family: var(--f-en); font-weight: 900; font-size: 15px; padding: 4px 12px; transform: rotate(-3deg); }
.card .body { padding: 14px 6px 0; display: flex; flex-direction: column; flex: 1; }
.card h3 { font-weight: 900; font-size: 21px; line-height: 1.35; color: var(--teal); margin: 0 0 6px; }
.card p.d { color: var(--grey-text); letter-spacing: 0.06em; line-height: 1.65; margin: 0 0 14px; font-size: 14.5px; }
.card .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; }
.card .more { background: var(--orange); color: var(--ink); border: 0; border-radius: 999px; font-weight: 700; font-size: 14px; padding: 7px 18px; }
.notes-sec .wrap { padding-block: 90px 100px; }
.notes-sec .tgroup { margin-bottom: 44px; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.notes.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.note { position: relative; background: var(--white); border-radius: 10px; padding: 34px 30px 30px; }
.note.y { background: var(--yellow); }
.note::before { content: ""; position: absolute; top: -10px; right: 50px; width: 84px; height: 22px; background: rgba(135, 204, 200, .85); transform: rotate(2.5deg); border-radius: 2px; }
.note .tiny { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--teal); margin: 0 0 8px; font-family: var(--f-en); }
.note h3 { font-weight: 900; font-size: 24px; margin: 0 0 16px; color: var(--teal); display: flex; align-items: center; gap: 10px; }
.note h3 .n { font-family: var(--f-en); font-weight: 700; font-size: 14px; color: var(--ink); background: var(--mint-pale); border-radius: 999px; padding: 2px 10px; }
.note ul.list { margin: 0; padding-left: 1.1em; letter-spacing: 0.06em; line-height: 1.75; font-weight: 700; }
.note ul.list li::marker { color: var(--orange); }
.note ul.check { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; letter-spacing: 0.05em; line-height: 1.6; font-weight: 700; font-size: 15px; }
.note ul.check li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.note ul.check li::before { content: "✓"; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: var(--white); font-size: 12px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip2 { font-size: 14px; letter-spacing: 0.05em; background: var(--cream); border-radius: 999px; padding: 5px 13px; }
.note.y .chip2 { background: rgba(255, 255, 255, .7); }
.chip2 .u { font-family: var(--f-en); font-weight: 700; font-size: 12px; color: var(--teal); margin-left: 4px; }
.req-ozzi { position: absolute; right: 18px; top: -58px; width: 110px; height: 98px; background: var(--char-ozzi) center / contain no-repeat; }

/* 方案切換、引導區、頁尾 */
.cta .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 470px); gap: 40px; align-items: center; padding-block: 120px 80px; }
.band.teal.cta { clip-path: polygon(0 26px, 100% 0, 100% 100%, 0 100%); }
.cta .big { font-weight: 900; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.4; margin: 30px 0 18px; }
.cta p.body { letter-spacing: 0.06em; line-height: 1.9; margin: 0 0 30px; color: #F2F8F7; max-width: 34em; }
.cta .btn.orange { font-size: 16px; padding: 14px 30px; gap: 12px; }
.cta .cast { aspect-ratio: 900 / 560; background: var(--cast-group) center / contain no-repeat; }
.pager-strip .wrap { padding-block: 10px 70px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pager a { display: block; text-decoration: none; background: var(--white); border-radius: 16px; padding: 14px 20px; box-shadow: 0 8px 16px -6px rgba(0, 0, 0, .12); transition: transform .2s; }
.pager a:hover { transform: translateY(-3px); }
.pager small { display: block; font-family: var(--f-en); font-weight: 700; color: var(--teal); font-size: 13px; }
.pager strong { font-weight: 900; font-size: 18px; letter-spacing: 0.04em; color: var(--teal); }
.pager a.next { text-align: right; }
/* 頁尾：依 Figma（FOLLOW US＋社群、聯絡資訊） */
.foot { background: #29495A; color: #8FC6C1; }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 28px; padding-block: 90px 80px; }
.follow { display: flex; align-items: center; gap: 16px; }
.fu { background: var(--white); color: var(--teal); font-family: var(--f-en); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; border-radius: 999px; padding: 5px 24px; }
.soc { width: 40px; height: 40px; border-radius: 9px; background: #8FC6C1; display: grid; place-items: center; transition: transform .2s, background .2s; }
.soc:hover { transform: translateY(-2px); background: var(--mint-light); }
.soc svg { width: 22px; height: 22px; fill: none; stroke: #29495A; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.copy { margin: 14px 0 0; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; }
.foot dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; line-height: 1.3; }
.foot dt { font-family: var(--f-en); padding-right: 8px; border-right: 1.5px solid currentColor; margin: 2px 0; }
.foot dd { margin: 2px 0; padding-left: 8px; }
.foot dd a { text-decoration: none; text-transform: uppercase; }

/* ── 單元彈窗（Figma 08 課程彈窗） ── */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(22, 36, 40, .62); }
.panel { position: relative; background: var(--white); border-radius: 40px; width: min(1100px, 100%); max-height: 100%; overflow-y: auto; padding: 58px 72px 60px; }
.close { position: absolute; top: 30px; right: 34px; width: 44px; height: 44px; border: 0; background: transparent; font-size: 34px; line-height: 1; color: #111; }
.watt { position: absolute; top: 70px; right: 90px; width: 150px; height: 176px; background: var(--char-watt) center / contain no-repeat; pointer-events: none; }
.panel .lead { font-weight: 700; letter-spacing: 0.1em; margin: 0 0 22px; max-width: 34em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: baseline; max-width: 680px; }
.kv .pill { font-size: 14px; padding: 3px 14px; justify-self: start; }
.kv span:not(.pill) { font-weight: 700; letter-spacing: 0.08em; font-size: 15px; }
.m-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 48px; margin-top: 44px; align-items: start; }
.m-photo { position: relative; padding: 10px 26px 30px 6px; }
.m-photo .ph { border: 8px solid var(--mint-light); border-radius: 22px; overflow: hidden; transform: rotate(-5deg); aspect-ratio: 4 / 3; }
.m-photo .ph img { width: 100%; height: 100%; object-fit: cover; }
.m-photo .tag2 { position: absolute; right: 0; bottom: 18px; transform: rotate(-4deg); background: var(--teal); color: var(--white); font-family: var(--f-en); font-weight: 900; font-size: 28px; line-height: 1; padding: 12px 22px; border-radius: 14px; }
.m-worlds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 28px; }
.m-worlds .pill { margin-bottom: 10px; font-size: 14px; padding: 3px 14px; }
.m-worlds p { margin: 0; font-weight: 700; letter-spacing: 0.08em; line-height: 1.7; font-size: 15px; }
.m-worlds p.none { color: #7F8E91; font-weight: 500; }
.m-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; border-top: 2px dashed #EBD9C2; padding-top: 22px; }
.m-nav button { border: 0; background: var(--cream); border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
.m-nav button:disabled { opacity: .35; cursor: default; }

/* ── 手機 ── */
@media (min-width: 901px) and (max-width: 1100px) { .pkgs { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .site-head .wrap { height: 66px; }
  .logo { width: 52px; height: 50px; background-size: auto 100%; }
  .nav { display: none; }
  .burger { display: block; }
  .hero .wrap, .intro .wrap, .cta .wrap, .m-grid { grid-template-columns: 1fr; gap: 28px; }
  .cta .wrap { padding-block: 100px 60px; }
  .cta .btn.orange { font-size: 14px; padding: 12px 20px; letter-spacing: 0.02em; }
  .cta .cast { max-width: 360px; width: 100%; justify-self: center; }
  .foot .wrap { flex-direction: column; padding-block: 56px 50px; }
  .foot dl { font-size: 13px; }
  .hero .wrap { min-height: 0; }
  .hero-copy { padding: 18px 0 0; }
  .hero-girl { position: relative; right: auto; bottom: auto; width: 74%; max-width: 340px; margin: -6px 0 -30px auto; }
  .hero-cast { display: none; }
  .hero .wrap > .hero-copy { padding-bottom: 8px; }
  .intro .framed { display: none; }   /* 手機版首屏已有照片，簡介區不再重複 */
  .hero-framed { margin: 0 auto 60px; max-width: 360px; }
  .star.s1 { width: 220px; } .star.s2 { top: auto; bottom: 20px; width: 240px; }
  .intro .wrap { padding-block: 80px 70px; }
  .units .wrap, .outcomes .wrap { padding-block: 110px 100px; }
  .courses .wrap { padding-block: 70px 70px; }
  .sec-head { flex-direction: column; align-items: flex-start; }
  .ozzi { width: 90px; margin: -60px 0 0; align-self: flex-end; }
  .tag-panel { grid-template-columns: 1fr; }
  .tabs { grid-template-columns: repeat(4, 1fr); }
  .tab { text-align: center; padding: 8px 2px; font-size: 13px; }
  .pkgs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .pkg { padding: 8px 8px 12px; border-radius: 14px; }
  .pkg .body { padding: 10px 4px 0; }
  .pkg h4 { font-size: 16px; }
  .pkg p.d { font-size: 13px; }
  .pkg .meta { flex-direction: column; align-items: stretch; gap: 6px; }
  .pkg .meta .time, .pkg .meta .go { text-align: center; }
  .photo .lv { font-size: 11px; left: 6px; bottom: 6px; padding: 2px 7px; }
  .cards, .notes, .notes.three { grid-template-columns: 1fr; gap: 28px; }
  .card:nth-child(n) { transform: rotate(-1deg); }
  .card:nth-child(2n) { transform: rotate(1deg); }
  .panel { padding: 56px 22px 34px; border-radius: 28px; }
  .watt { width: 80px; height: 94px; top: 52px; right: 18px; }
  .close { top: 10px; right: 12px; }
  .m-worlds { grid-template-columns: 1fr; }
  .pager { grid-template-columns: 1fr; }
}
/* ════ v3 選課指南 ════ */
/* 三種方案切換列 */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 40px; }
.modes a { display: flex; align-items: center; gap: 12px; text-decoration: none; background: rgba(255, 255, 255, .55); border-radius: 18px; padding: 10px 16px 10px 10px; font-weight: 900; font-size: 17px; letter-spacing: 0.06em; color: var(--teal); transition: background .2s, transform .2s; }
.modes a:hover { background: var(--white); transform: translateY(-2px); }
.modes a[aria-current="page"] { background: var(--white); box-shadow: 0 8px 16px -6px rgba(0, 0, 0, .18), inset 0 0 0 3px var(--orange); }
.modes img { width: 52px; height: 52px; object-fit: contain; flex: none; }
.modes small { display: block; font-family: var(--f-en); font-weight: 700; font-size: 12px; letter-spacing: 0.02em; color: var(--teal); line-height: 1.2; }
/* 小首屏 */
.hero.small .wrap { min-height: 380px; grid-template-columns: minmax(0, 1fr) auto; }
.hero.small .hero-copy { padding: 30px 0 76px; }
.en-big { font-family: var(--f-en); font-weight: 900; font-size: clamp(34px, 4.4vw, 52px); line-height: 1; color: var(--teal); margin: 4px 0 0; letter-spacing: -0.01em; }
.hero.small h1 { margin-top: 8px; }
.mode-icon { position: relative; z-index: 1; width: 290px; height: 290px; border-radius: 50%; display: grid; place-items: center; margin: 0 20px 96px 0; transform: rotate(-4deg); }
.mode-icon img { width: 60%; height: 60%; object-fit: contain; }
/* 指南三卡（Figma Find Your Course） */
.guide .wrap { padding-block: 130px 120px; }
.guide-cards, .rel-cards { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 32px; }
.gcard, .rcard { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; background: var(--white); border-radius: 26px; box-shadow: var(--shadow-card); padding: 34px 28px 30px; transition: transform .25s ease, box-shadow .25s; }
.gcard:nth-child(3), .rcard:nth-child(1) { transform: rotate(-1.6deg); }
.gcard:nth-child(4), .rcard:nth-child(2) { transform: rotate(1deg) translateY(-8px); }
.gcard:nth-child(5), .rcard:nth-child(3) { transform: rotate(1.8deg) translateY(6px); }
.gcard:hover, .rcard:hover { transform: rotate(0) translateY(-6px); box-shadow: 0 20px 28px 6px rgba(0, 0, 0, .14); }
.gdisc { width: 182px; height: 182px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 20px; }
.gdisc img { width: 60%; height: 60%; object-fit: contain; }
.gen { font-family: var(--f-en); font-weight: 900; font-size: 22px; color: var(--teal); line-height: 1.2; }
.gname { font-weight: 900; font-size: 26px; color: var(--teal); margin: 4px 0 12px; letter-spacing: 0.04em; }
.gdesc { color: var(--grey-text); letter-spacing: 0.08em; line-height: 1.75; font-size: 15px; margin-bottom: 22px; max-width: 17em; }
.gdesc b { color: var(--teal); font-family: var(--f-en); }
.gcard .go, .rcard .go { margin-top: auto; padding: 9px 26px; font-size: 15px; }
/* 分齡 */
.stages { display: grid; gap: 34px; }
.stage { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 28px 36px; align-items: start; background: rgba(255, 255, 255, .45); border-radius: 26px; padding: 28px; scroll-margin-top: 110px; }
.stage-side { position: sticky; top: 110px; }
.age { display: inline-block; background: var(--teal); color: var(--white); font-family: var(--f-en); font-weight: 900; font-size: 30px; line-height: 1; padding: 12px 22px; border-radius: 14px; transform: rotate(-3deg); }
.stage.s1 .age { background: var(--orange); color: var(--ink); }
.stage.s2 .age { background: var(--ink); }
.grade { font-weight: 900; font-size: 17px; letter-spacing: 0.06em; color: var(--teal); margin: 18px 0 8px; }
.sdesc { font-size: 14.5px; letter-spacing: 0.06em; line-height: 1.8; margin: 0; }
.pkgs.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.note-line { font-size: 14px; letter-spacing: 0.06em; margin: 22px 4px 0; opacity: .85; }
/* 單元結果 */
.units-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 20px; }
.ucard { display: flex; flex-direction: column; text-decoration: none; background: var(--white); border-radius: 16px; padding: 10px 10px 14px; box-shadow: 0 8px 16px 0 rgba(0, 0, 0, .09); transition: transform .2s, box-shadow .2s; }
.ucard:hover { transform: translateY(-4px); box-shadow: 0 16px 24px 2px rgba(0, 0, 0, .12); }
.ucard .photo { aspect-ratio: 16 / 10; }
.ub { display: flex; flex-direction: column; gap: 6px; padding: 12px 4px 0; flex: 1; }
.upkg { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; color: #8A5B12; }
.ub strong { font-weight: 900; font-size: 17px; line-height: 1.35; color: var(--teal); }
.hits { display: flex; flex-wrap: wrap; gap: 4px; }
.hits i { font-style: normal; background: var(--teal); color: var(--white); font-size: 12.5px; border-radius: 999px; padding: 2px 9px; letter-spacing: 0.03em; }
.udesc { color: var(--grey-text); font-size: 13.5px; letter-spacing: 0.04em; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.utime { margin-top: auto; align-self: flex-start; font-weight: 700; font-size: 12.5px; background: var(--mint-pale); border-radius: 999px; padding: 3px 10px; }
/* ── 角色代言卡 v2：精緻化＋小動態 ── */
.chars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 22px; margin-top: 10px; }
.cc { --wc: #87CCC8; --wp: #E1F3F1; --wd: #1D4C58; position: relative; background: var(--white); border-radius: 26px; box-shadow: 0 12px 22px -4px rgba(28, 77, 89, .16); display: flex; flex-direction: column; overflow: hidden; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), box-shadow .3s; }
.cc.sci { --wc: #87CCC8; --wp: #E3F4F2; --wd: #1D6A6B; --i: 0; }
.cc.eng { --wc: #F08419; --wp: #FDEBD6; --wd: #A04F00; --i: 1; }
.cc.tech { --wc: #4E93A3; --wp: #DCEBEF; --wd: #1C4D59; --i: 2; }
.cc.art { --wc: #F2B230; --wp: #FCF0D3; --wd: #8A5A00; --i: 3; }
.cc:hover { transform: translateY(-6px); box-shadow: 0 22px 30px -6px rgba(28, 77, 89, .22); }
.cc .stagebox { position: relative; height: 196px; background: var(--wp); display: grid; place-items: end center; padding-bottom: 18px; }
.cc .stagebox::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 26px; background: var(--white); clip-path: polygon(0 60%, 100% 0, 100% 100%, 0 100%); }
.cc .spot { position: absolute; left: 50%; top: 22px; width: 150px; height: 146px; margin-left: -75px; color: var(--wc); opacity: .32; animation: spin 40s linear infinite; }
.cc .spot path { fill: currentColor; }
.cc .floor { position: absolute; bottom: 30px; left: 50%; width: 92px; height: 12px; margin-left: -46px; border-radius: 50%; background: rgba(28, 77, 89, .18); animation: shadow 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -0.8s); }
.cc .pic { position: relative; z-index: 2; width: 132px; height: 140px; margin-bottom: 18px; background: center bottom / contain no-repeat; transform-origin: 50% 100%; animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -0.8s); }
.cc.eng .pic { animation-name: sway; } .cc.art .pic { animation-name: sway; animation-duration: 4s; }
.cc:hover .pic { animation: hop .6s cubic-bezier(.3, 1.6, .5, 1) 1, bob 3.4s ease-in-out .6s infinite; }
.cc.active .pic { animation: cheer .9s ease-in-out infinite; }
.cc .spark { position: absolute; z-index: 1; width: 16px; height: 16px; background: var(--wc); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: twinkle 2.6s ease-in-out infinite; }
.cc .spark.s1 { left: 22%; top: 34px; } .cc .spark.s2 { right: 20%; top: 70px; width: 11px; height: 11px; animation-delay: -1.3s; }
.cc .spark.s3 { left: 30%; bottom: 52px; width: 9px; height: 9px; animation-delay: -.6s; }
.cc .bubble { position: absolute; z-index: 3; top: 14px; left: 50%; translate: -50% 0; max-width: 88%; background: var(--white); color: var(--wd); font-weight: 900; font-size: 13.5px; letter-spacing: 0.04em; line-height: 1.35; text-align: center; padding: 7px 13px; border-radius: 14px; box-shadow: 0 6px 14px -4px rgba(0, 0, 0, .2); opacity: 0; transform: translateY(8px) scale(.8); transition: opacity .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; white-space: nowrap; }
.cc .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--white); }
.cc.active .bubble { opacity: 1; transform: none; }
.cc .cbody { position: relative; padding: 4px 20px 22px; display: flex; flex-direction: column; flex: 1; text-align: center; }
.cc .wen { font-family: var(--f-en); font-weight: 900; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal); margin: 0; }
.cc h3 { font-weight: 900; font-size: 22px; line-height: 1.3; color: var(--teal); margin: 2px 0 8px; }
.cc .who { align-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; margin: 0 0 16px; padding: 3px 12px 3px 4px; border-radius: 999px; background: var(--wp); color: var(--wd); }
.cc .who b { font-family: var(--f-en); font-weight: 900; background: var(--wc); color: var(--white); border-radius: 999px; padding: 0 9px; font-size: 12.5px; }
.cc.eng .who b, .cc.art .who b { color: var(--ink); }
.cc .tags { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
.wt { border: 1.5px solid color-mix(in srgb, var(--wc) 55%, white); background: var(--white); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 500; letter-spacing: 0.03em; line-height: 1.4; transition: background .15s, border-color .15s, transform .25s cubic-bezier(.3, 1.6, .5, 1), color .15s; }
button.wt:hover { background: var(--wp); border-color: var(--wc); transform: translateY(-2px); }
button.wt[aria-pressed="true"] { background: var(--wd); border-color: var(--wd); color: var(--white); transform: scale(1.06); }
.wt.none { border-style: dashed; color: #7F8E91; }
.cc .cnt { margin: auto 0 0; padding-top: 16px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; color: #7A8C90; }
.cc .cnt b { font-family: var(--f-en); color: var(--teal); font-size: 15px; margin-right: 2px; }
.hint { text-align: center; font-weight: 700; letter-spacing: 0.06em; font-size: 15px; margin: 28px auto 0; min-height: 1.6em; display: table; background: var(--white); border-radius: 999px; padding: 8px 22px; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .15); }
.hint a { color: #A5560D; margin-left: 6px; }
.cards.dim .card.hit { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
/* 其他角色也動起來 */
.ozzi, .req-ozzi, .no-result .char { animation: bob 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.hero-cast, .cta .cast { animation: float 5s ease-in-out infinite; }

/* ════════════════════════════════════════════════════════════════

/* ════════════════════════════════════════════════════════════════
   2. 設定：照片對應、四大世界
   照片目前是 Figma 稿裡的代表照片；有各方案／單元的實拍照時，改 PKG_PHOTO 或在 db 的 img 欄位填網址即可。
   ════════════════════════════════════════════════════════════════ */
const PHOTOS = {{PHOTOS}};
const HERO_GIRL = '{{HERO_GIRL}}';
const PKG_PHOTO = { p1: '3dpen', p2: 'cutting', p3: 'play', p4: 'robots', p5: 'wiring', p6: 'chem', p7: 'laugh', p8: 'class', p9: 'wiring', p10: 'robots', p11: 'play' };
const WORLDS = [
  { key: 'sci', name: '科學/化學', full: '科學/化學世界', en: 'Science & Chemistry' },
  { key: 'eng', name: '工程', full: '工程世界', en: 'Engineering' },
  { key: 'tech', name: '科技', full: '科技世界', en: 'Technology' },
  { key: 'art', name: '藝術', full: '藝術世界', en: 'Art' }
];
const BLOB = '{{BLOB}}';

function unitPhoto(u, i) {
  if (u.img) return u.img;
  const rules = [
    [/3D列印/, ['3dpen']], [/化學|溶液|鮭魚卵|寶石|墨水|水晶|電解|鞭炮|清潔/, ['chem']],
    [/機器人|車|龍舟|纜車|投籃|機構|連桿|爪|機械|緩降|發射/, ['robots', 'play']], [/程式|Arduino/, ['class']],
    [/電|LED|馬達|燈|聲音|開關|扇|感測/, ['wiring']], [/卡片|畫|藝術|色彩|剪|鑰匙圈|扭扭筆|造型|設計/, ['cutting']],
    [/迷宮|遊樂|陀螺|足球|搖獎|釣魚|相撲|蟲蟲|球|銀行|金庫|存錢|飲料|壽司/, ['play', 'laugh', 'class']]
  ];
  const hit = rules.find(([re]) => re.test(u.title));
  const pool = hit ? hit[1] : ['class', 'laugh'];
  return PHOTOS[pool[i % pool.length]];
}
const pkgPhoto = p => p.intro_image || PHOTOS[PKG_PHOTO[p.id] || 'class'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
/* 靜態網站版（SEO）：每個方案有自己的網址，例如 /courses/steam-little-inventor/；預覽版仍用 #p1 */
const BASE = window.WECLASS_BASE || '';
const SLUGS = { p1: 'steam-little-inventor', p2: 'steam-creative-lab', p3: 'steam-playground', p4: 'robot-sports-day', p5: 'desktop-tech', p6: 'japanese-sushi-shop', p7: 'little-banker', p8: 'land-sea-air-vehicles', p9: 'smart-night-light', p10: 'sweeping-robot', p11: 'crazy-basketball-machine' };
const setTitle = s => { if (!BASE) document.title = s; };   // 靜態網站版保留每頁預先寫好的標題
const slugOf = p => p.slug || SLUGS[p.id] || p.id;
const pathFor = id => { const p = db.find(x => x.id === id); return BASE + (p ? slugOf(p) + '/' : ''); };
function hrefMap(h) {
  if (h === '#') return BASE;
  if (h === '#all') return BASE + 'all/';
  const m = String(h).match(/^#(p\d+)(?:\.(\d+))?$/);
  return m ? pathFor(m[1]) + (m[2] ? '#u' + m[2] : '') : null;
}
const minutes = p => p.units.reduce((a, u) => a + (parseInt(u.duration, 10) || 0), 0);

/* ════════════════════════════════════════════════════════════════
   3. 篩選（規則與 v1.1 相同）
   - 勾選的標籤只要有任一個符合就列出單元
   - 比對範圍限同一分類：同一個標籤出現在兩個分類時（如「四連桿機構」）各自獨立
   ════════════════════════════════════════════════════════════════ */
const TAGS = {};   // { sci: [{tag, n}], ... } n = 出現在幾個單元
function buildTags() {
  WORLDS.forEach(w => {
    const m = new Map();
    db.forEach(p => p.units.forEach(u => u[w.key].forEach(t => m.set(t, (m.get(t) || 0) + 1))));
    TAGS[w.key] = [...m].map(([tag, n]) => ({ tag, n })).sort((a, b) => a.tag.localeCompare(b.tag, 'zh-Hant'));
  });
}
buildTags();
const state = { selected: new Set(), tab: 'sci', query: '', from: 'theme', jumpStage: '' };   // selected 內容為 "sci|熱塑性塑膠"
function matchUnits() {
  const sel = [...state.selected].map(k => { const [cat, ...rest] = k.split('|'); return { cat, tag: rest.join('|') }; });
  const out = new Map();   // pkgId -> [unitIndex]
  if (!sel.length) return out;
  db.forEach(p => p.units.forEach((u, i) => {
    if (sel.some(s => u[s.cat].includes(s.tag))) { if (!out.has(p.id)) out.set(p.id, []); out.get(p.id).push(i); }
  }));
  return out;
}

/* ════════════════════════════════════════════════════════════════
   4. 選課指南：三種選課方案（對應官網 Find Your Course 三張卡）
   #theme 小小職人主題包 / #stage 系統分齡課程包 / #goal 課綱單元課程包
   ════════════════════════════════════════════════════════════════ */
const app = document.getElementById('app');
let totalUnits = db.reduce((a, p) => a + p.units.length, 0);
const MODES = [
  { id: 'theme', en: 'Explore by Theme', name: '小小職人主題包', desc: '以趣味主題串聯課程，在動手創作中探索科學、藝術與工程', icon: 'ic-theme', disc: 'rgba(241,141,0,.26)' },
  { id: 'stage', en: 'Grow by Stage', name: '系統分齡課程包', desc: '依年齡與發展階段挑選適齡課程，從基礎到進階更貼近孩子的狀態', icon: 'ic-stage', disc: '#E7EEEE' },
  { id: 'goal', en: 'Learn by Goal', name: '課綱單元課程包', desc: '對應 108 課綱與學習目標，讓學習變成看得見、做得到的體驗', icon: 'ic-goal', disc: 'var(--mint-pale)' }
];
// 分齡：依 Figma 課程彈窗（Age 6~8／9~11／11+）與方案的適合年級對應
const STAGES = [
  { id: 'a6', age: 'Age 6~8', grade: '約 1~2 年級', desc: '小肌肉發展期，著重實作技巧與工具使用，從基本文具到安全操作熱熔膠槍、膠帶與尺規，帶孩子從平面邁向立體作品，盡情展現想像力。', grades: ['1~3年級', '1~6年級'] },
  { id: 'a9', age: 'Age 9~11', grade: '約 3~5 年級', desc: '提升實作技巧與科學素養，導入電子銲接與化學實驗設備。任務融入物理、化學、機械、電學原理，讓孩子應用原理改造作品，並養成實驗記錄的習慣。', grades: ['1~6年級', '3~6年級'] },
  { id: 'a11', age: 'Age 11+', grade: '9~15 歲', desc: '導入 Arduino 機器人程式與 3D 列印的大型專案，掌握數位建模與開源程式，體驗「從零創造」，培養科技創造的關鍵能力。', grades: ['9~15歲'] }
];
const stagesOf = p => STAGES.filter(s => s.grades.includes(p.grades));
const assetUrl = name => (getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).match(/url\(["']?(.*?)["']?\)/) || [])[1] || '';

function modeSwitch(cur) {
  return `<nav class="modes" aria-label="三種選課方案">${MODES.map(m => `<a href="#${m.id}"${m.id === cur ? ' aria-current="page"' : ''}><img src="${assetUrl(m.icon)}" alt=""><span><small>${m.en}</small>${m.name}</span></a>`).join('')}</nav>`;
}
function smallHero(m, extra = '') {
  return `<section class="hero small" aria-labelledby="mh-title">

      <div class="hero-copy">
        <p class="crumb"><a href="https://weclass.tw/" target="_blank" rel="noopener">WeClass 官網</a><span aria-hidden="true">›</span><span>${m.name}</span></p>
        <p class="en-big" aria-hidden="true">${m.en}</p>

}

function renderGoal() {
  setTitle('WeClass 課綱單元課程包');
  setNav('goal'); state.from = 'goal';
  const m = MODES[2];

  <section class="band mint courses" aria-label="依學習目標找單元">
    <div class="wrap">
      <div class="tag-panel" id="tag-panel">
        <div class="side">

          <label class="search"><span aria-hidden="true">⌕</span><span class="sr">搜尋標籤</span><input id="q" type="search" placeholder="搜尋標籤，例如：磁力" autocomplete="off"></label>
          <p class="empty-hint">點選想培養的知識與技能，下方即時列出符合的單元；同一分類內任一標籤符合即列出。</p>
        </div>
        <div class="tag-list" id="tag-list" role="tabpanel"></div>
      </div>
      <div class="picked" id="picked" hidden></div>
      <p class="summary" id="summary" aria-live="polite" style="margin-bottom:18px"></p>
      <div class="units-grid" id="results"></div>
    </div>
  </section>
  ${faqSection(homeFaq())}
  ${ctaBand({ title: '想看完整主題？', body: '每個單元都屬於一個課程方案，點單元可以看學習重點，也可以瀏覽全部 11 個課程方案。', btn: { href: '#all', text: '看全部課程方案' } })}`;
  bindGoal(); updateGoal(); renderCart(); window.scrollTo(0, 0);

function bindGoal() {
  document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { state.tab = b.dataset.k; updateGoal(); } });
  const q = document.getElementById('q'); q.value = state.query;
  q.addEventListener('input', () => { state.query = q.value.trim(); updateGoal(); });
  document.getElementById('tag-list').addEventListener('click', e => { const b = e.target.closest('.tag'); if (!b) return; const k = b.dataset.k; state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k); updateGoal(); });
  document.getElementById('picked').addEventListener('click', e => {
    if (e.target.closest('.clear')) { state.selected.clear(); updateGoal(); return; }
    const c = e.target.closest('.chip'); if (c) { state.selected.delete(c.dataset.k); updateGoal(); }
  });
}
function updateGoal() {
  document.getElementById('tabs').innerHTML = WORLDS.map(w => { const n = [...state.selected].filter(k => k.startsWith(w.key + '|')).length; return `<button class="tab" role="tab" data-k="${w.key}" aria-selected="${state.tab === w.key}">${w.full}${n ? `<span class="cnt">${n}</span>` : ''}</button>`; }).join('');
  const q = state.query;
  const lists = q ? WORLDS.map(w => ({ w, items: TAGS[w.key].filter(t => t.tag.includes(q)) })) : [{ w: WORLDS.find(w => w.key === state.tab), items: TAGS[state.tab] }];
  document.getElementById('tag-list').innerHTML = lists.filter(l => l.items.length).map(l => (q ? `<p class="empty-hint" style="width:100%;font-weight:700">${l.w.full}</p>` : '') + l.items.map(t => { const k = `${l.w.key}|${t.tag}`; return `<button class="tag" data-k="${esc(k)}" aria-pressed="${state.selected.has(k)}">${esc(t.tag)}<span class="n">${t.n}</span></button>`; }).join('')).join('') || `<p class="empty-hint">找不到「${esc(q)}」，換個關鍵字試試。</p>`;
  const picked = document.getElementById('picked'); picked.hidden = !state.selected.size;
  picked.innerHTML = state.selected.size ? [...state.selected].map(k => { const [cat, ...r] = k.split('|'); const w = WORLDS.find(x => x.key === cat); return `<button class="chip" data-k="${esc(k)}" aria-label="移除 ${esc(r.join('|'))}">${esc(r.join('|'))}<i>${w.name}</i><span class="x" aria-hidden="true">×</span></button>`; }).join('') + `<button class="clear">清除全部</button>` : '';
  const matched = matchUnits(); const filtering = state.selected.size > 0;
  const sel = [...state.selected].map(k => { const [cat, ...r] = k.split('|'); return { cat, tag: r.join('|') }; });
  const items = [];
  db.forEach(p => p.units.forEach((u, i) => { if (!filtering || (matched.get(p.id) || []).includes(i)) items.push({ p, u, i }); }));
  const pk = new Set(items.map(x => x.p.id)).size;
  document.getElementById('summary').innerHTML = filtering ? `符合<b>${items.length}</b>個單元，來自<b>${pk}</b>個方案` : `全部<b>${items.length}</b>個單元，選擇學習目標來縮小範圍`;
  document.getElementById('results').innerHTML = items.length ? items.map(({ p, u, i }) => {
    const hitTags = sel.filter(s => u[s.cat].includes(s.tag)).map(s => s.tag);
    return `<a class="ucard" href="#${p.id}.${i + 1}">
      <span class="photo"><img src="${unitPhoto(u, i)}" alt="" loading="lazy"><span class="lv">${p.type === '進階' ? 'Project' : `Unit ${pad(i + 1)}`}</span></span>

function bindExplore(p) {

          <div class="photo"><img src="${unitPhoto({ title: o.title }, i)}" alt="" loading="lazy"><span class="lv">Skill ${pad(i + 1)}</span></div>
          <div class="body"><h3>${esc(o.title)}</h3><p class="d">${esc(o.desc)}</p></div>
        </article>`).join('')}
      </div>
    </div>
  </section>
  <section class="band peach notes-sec" aria-labelledby="sc-title" style="margin-top:-70px">
    <div class="wrap" style="padding-block:120px 110px">
      <div class="tgroup"><p class="en" aria-hidden="true">Schedule</p><h2 id="sc-title">詳細課程表</h2><p class="d">三天的大型專案，從設計、組裝到程式撰寫與成果發表。</p></div>
      <div class="notes three">${p.schedule.map((d, i) => `
        <article class="note ${i === 1 ? 'y' : ''}"><p class="tiny">Day ${i + 1}</p><h3>${esc(d.day)}</h3><ul class="list">${d.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></article>`).join('')}
      </div>
    </div>
  </section>
  <section class="notes-sec" aria-labelledby="rq-title">
    <div class="wrap">
      <div class="notes">
        <article class="note y" style="grid-row:span 2">
          <span class="req-ozzi" aria-hidden="true"></span>
          <p class="tiny">Requirements</p><h3 id="rq-title">課程需求</h3>
          <ul class="check">${p.requirements.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
        </article>
        <article class="note" id="project" style="scroll-margin-top:120px">
          <p class="tiny">Project</p><h3>${esc(u.title)}<span class="n">${esc(u.duration)}</span></h3>
          <p style="margin:0 0 16px;letter-spacing:.08em;font-weight:700">${esc(u.desc)}</p>
          <div class="kv"><span class="pill teal">科學知識</span><span>${esc(u.sci_desc)}</span><span class="pill teal">技能訓練</span><span>${esc(u.skill_desc)}</span></div>
        </article>
      </div>
    </div>
  </section>
  <section class="notes-sec" aria-labelledby="wd-title" style="padding-top:0">
    <div class="wrap" style="padding-top:0">
      <div class="tgroup"><p class="en" aria-hidden="true">Four Worlds</p><h2 id="wd-title">四大學習世界</h2><p class="d">這個專案涵蓋的學習標籤。</p></div>
      ${worldChars(p, false)}
    </div>
  </section>
  ${faqSection(packageFaq(p))}
  ${relatedPacks(p)}
  ${ctaBand({ title: '還想看其他方案？', body: '回到課綱單元課程包依學習目標找單元，或切換到上一個、下一個課程方案。', btn: { href: '#', text: '回課綱單元課程包' }, pager })}`;
}

// 官方 LINE 連結：請換成正式的加入好友網址（例如 https://lin.ee/xxxx）
const LINE_URL = 'https://weclass.tw/';
function ctaBand({ pager = '' } = {}) {
  return `${pager ? `<section class="pager-strip" aria-label="上一個、下一個方案"><div class="wrap">${pager}</div></section>` : ''}
  <section class="band teal cta on-teal" aria-labelledby="cta-title">
    <div class="wrap">
      <div>
        <div class="tgroup"><p class="en" aria-hidden="true">Contact Us</p><h2 id="cta-title">洽談合作</h2></div>
        <p class="big">為您的課堂注入 STEAM 創新能量！</p>
        <p class="body">無論是常態課程、課後社團或冬夏令營，WeClass 皆能為您量身規劃。<br>立即加入官方 LINE，WeClass 教育顧問將盡快與您聯繫。</p>
        <a class="btn orange" href="${LINE_URL}" target="_blank" rel="noopener">加入官方 LINE，索取【最新機構合作方案】<span aria-hidden="true">↗</span></a>
      </div>
      <div class="cast" role="img" aria-label="WeClass 品牌角色群像"></div>
    </div>
  </section>`;
}

/* ════════════════════════════════════════════════════════════════
   6. 單元彈窗
   ════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════
   7. 路由：# → 總覽、#find → 總覽並捲到找課、#p1 → 方案頁、#p1.3 → 方案頁＋第 3 單元
   ════════════════════════════════════════════════════════════════ */
/* 電腦版導覽列「全部課程方案」的下拉選單：分初階、進階列出每個方案，任何一頁都能直接換課程 */
function navDropHtml() {
  const col = (type, note) => `<div class="nd-col"><p class="nd-h">${type}課程<small>${note}</small></p><ul>${db.filter(p => p.type === type).map(p => `<li><a href="#${p.id}" data-pid="${p.id}"><span>${esc(p.title)}</span><small>${esc(p.grades)}</small></a></li>`).join('')}</ul></div>`;
  return col('初階', '單元實作') + col('進階', '3 天專案') + '<a class="nd-all" href="#all">看全部課程方案 →</a>';
}
function renderNavDrop() {
  const el = document.getElementById('navdrop'); if (!el) return;
  el.innerHTML = navDropHtml();
  const cur = (location.hash.match(/^#(p\d+)/) || [])[1] || (BASE ? (db.find(p => decodeURIComponent(location.pathname).includes('/' + slugOf(p) + '/')) || {}).id : '');
  el.querySelectorAll('[data-pid]').forEach(a => a.toggleAttribute('aria-current', a.dataset.pid === cur));
}
window.addEventListener('hashchange', renderNavDrop);

function setNav(which) {
  ['goal', 'all'].forEach(k => { const el = document.getElementById('nav-' + k); if (k === which) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current'); });
}
/* 手機漢堡選單 */
const burger = document.getElementById('burger'), mnav = document.getElementById('mnav');
function renderMnav() {
  const h = location.hash.replace('#', '').split('.')[0];
  const grp = type => db.filter(p => p.type === type).map(p => `<li><a href="#${p.id}"${h === p.id ? ' aria-current="page"' : ''}>${esc(p.title)}</a></li>`).join('');
  mnav.innerHTML = `<div class="main"><a href="#"${h === '' ? ' aria-current="page"' : ''}>依學習目標找單元<span aria-hidden="true">→</span></a><a href="#all"${h === 'all' ? ' aria-current="page"' : ''}>全部課程方案<span aria-hidden="true">→</span></a><a href="https://weclass.tw/" class="official">回 WeClass 官網<span aria-hidden="true">↗</span></a></div>
    <h3>初階課程<small>1~6 年級</small></h3><ul>${grp('初階')}</ul>
    <h3>進階課程<small>9~15 歲</small></h3><ul>${grp('進階')}</ul>`;
}
function setMenu(open) {
  if (open) renderMnav();
  mnav.hidden = !open; burger.setAttribute('aria-expanded', open); burger.setAttribute('aria-label', open ? '關閉選單' : '開啟選單');
}
burger.addEventListener('click', () => setMenu(mnav.hidden));
mnav.addEventListener('click', e => { const a = e.target.closest('a'); if (a) { setMenu(false); if (a.getAttribute('href') === '#' && location.hash === '') renderGoal(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mnav.hidden) { setMenu(false); burger.focus(); } });
document.addEventListener('click', e => { if (!mnav.hidden && !e.target.closest('.site-head')) setMenu(false); });
window.matchMedia('(min-width: 901px)').addEventListener('change', e => { if (e.matches) setMenu(false); });

function route() {
  if (!mnav.hidden) setMenu(false);
  const h = location.hash.replace('#', '');
  if (BASE) {
    const legacy = h ? hrefMap('#' + h) : null;
    if (legacy) { location.replace(legacy); return; }
    const path = decodeURIComponent(location.pathname), at = path.indexOf(BASE);
    const rest = (at >= 0 ? path.slice(at + BASE.length) : '').replace(/index\.html$/, '').replace(/\/$/, '');
    const pk = db.find(x => slugOf(x) === rest), un = (h.match(/^u(\d+)$/) || [])[1];
    if (pk) renderPackage(pk, un ? +un : 0);
    else if (rest === 'all') renderTheme();
    else renderGoal();
    return;
  }
  const m = h.match(/^(p\d+)(?:\.(\d+))?$/);
  const p = m && db.find(x => x.id === m[1]);
  if (p) renderPackage(p, m[2] ? +m[2] : 0);
  else if (h === 'all' || h === 'theme') renderTheme();
  else renderGoal();
}
window.addEventListener('hashchange', route);
/* ════ 我的課程清單：勾選有興趣的方案或單元，選身份後用官方 LINE 傳給顧問 ════ */
const LINE_OA_ID = '';   // 官方 LINE 帳號 ID，例如 '@weclass'（留空時改為複製訊息）
const ROLES = ['企業合作', '教材採購', '營隊合作'];
const CART_KEY = 'weclass-cart-v1';
let cart = [], cartRole = '', cartOpen = false;
try { const s = JSON.parse(localStorage.getItem(CART_KEY) || '{}'); cart = Array.isArray(s.items) ? s.items : []; cartRole = s.role || ''; } catch (e) {}
const cartSave = () => { try { localStorage.setItem(CART_KEY, JSON.stringify({ items: cart, role: cartRole })); } catch (e) {} };
function cartFind(key) {
  const [k, id] = key.split(':');
  if (k === 'p') { const p = db.find(x => x.id === id); return p && { key, kind: 'p', p }; }
  for (const p of db) { const u = p.units.find(x => x.id === id); if (u) return { key, kind: 'u', p, u }; }
  return null;
}
function cartBtn(key, mini) {
  const on = cart.includes(key), pack = key[0] === 'p';
  return `<button type="button" class="addc${mini ? ' mini' : ''}${pack ? ' pack' : ''}" data-ck="${key}" aria-pressed="${on}">${on ? (pack ? '已加入整個方案 ✓' : '已加入 ✓') : (pack ? '＋ 加入整個方案' : '＋ 加入清單')}</button>`;
}
function cartSync() { document.querySelectorAll('[data-ck]').forEach(b => { const tmp = document.createElement('div'); tmp.innerHTML = cartBtn(b.dataset.ck, b.classList.contains('mini')); const n = tmp.firstChild; b.setAttribute('aria-pressed', n.getAttribute('aria-pressed')); b.textContent = n.textContent; }); }
function cartItems() { return cart.map(cartFind).filter(Boolean); }
function cartTotal(items) {
  const packs = new Set(items.filter(x => x.kind === 'p').map(x => x.p.id));
  let m = 0, days = 0;
  items.forEach(x => {
    if (x.kind === 'p') { if (x.p.type === '進階') days += 3; else m += minutes(x.p); }
    else if (!packs.has(x.p.id)) { const n = parseInt(x.u.duration, 10); if (n) m += n; else days += 3; }
  });
  return { m, days, text: [m ? `${m} 分鐘` : '', days ? `${days} 天專案` : ''].filter(Boolean).join('＋') || '—' };
}
function cartMessage(items) {
  const lines = items.map(x => x.kind === 'p' ? `・${x.p.title}（整個方案・${x.p.type === '進階' ? '3 天專案' : `${x.p.units.length} 個單元・${minutes(x.p)} 分鐘`}）` : `・${x.u.title}（${x.p.title}・${x.u.duration}）`);
  return `您好，我想詢問「${cartRole}」：\n${lines.join('\n')}\n合計約 ${cartTotal(items).text}\n（來自 WeClass 課程網站）`;
}
function renderCart() {
  let el = document.getElementById('cart');
  if (!el) { el = document.createElement('aside'); el.id = 'cart'; el.className = 'cart'; el.setAttribute('aria-label', '我的課程清單'); document.body.appendChild(el); }
  const items = cartItems();
  if (!items.length) { el.hidden = true; cartOpen = false; return; }
  el.hidden = false; el.classList.toggle('open', cartOpen);
  const tot = cartTotal(items);
  el.innerHTML = `<button type="button" class="cart-bar" aria-expanded="${cartOpen}"><span>我的課程清單<b>${items.length}</b></span><small>${tot.text}</small><span class="cv" aria-hidden="true">${cartOpen ? '▾' : '▴'}</span></button>
    <div class="cart-body"${cartOpen ? '' : ' hidden'}>
      <ol>${items.map(x => `<li><span><b>${esc(x.kind === 'p' ? x.p.title : x.u.title)}</b><small>${x.kind === 'p' ? '整個方案・' + (x.p.type === '進階' ? '3 天專案' : minutes(x.p) + ' 分鐘') : esc(x.p.title) + '・' + esc(x.u.duration)}</small></span><button type="button" class="rm" data-rm="${x.key}" aria-label="移除 ${esc(x.kind === 'p' ? x.p.title : x.u.title)}">✕</button></li>`).join('')}</ol>
      <p class="cart-q">您是哪一種合作？</p>
      <div class="roles" role="radiogroup">${ROLES.map(r => `<button type="button" role="radio" data-role="${r}" aria-checked="${cartRole === r}">${r}</button>`).join('')}</div>
      <p class="cart-err" id="cart-err" aria-live="polite"></p>
      <button type="button" class="cart-send">用 LINE 傳給 WeClass 顧問</button>
      <button type="button" class="cart-clear">清空清單</button>
    </div>`;
}
function cartToggle(key) { cart = cart.includes(key) ? cart.filter(k => k !== key) : [...cart, key]; cartSave(); cartSync(); if (cart.length === 1 && cart.includes(key)) cartOpen = false; renderCart(); }
document.addEventListener('click', e => {
  const add = e.target.closest('.addc');
  if (add) { e.preventDefault(); e.stopPropagation(); cartToggle(add.dataset.ck); const bar = document.querySelector('#cart .cart-bar'); if (bar) { bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); } return; }
  const c = e.target.closest('#cart'); if (!c) return;
  if (e.target.closest('.cart-bar')) { cartOpen = !cartOpen; renderCart(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { cartToggle(rm.dataset.rm); return; }
  const role = e.target.closest('[data-role]'); if (role) { cartRole = role.dataset.role; cartSave(); renderCart(); return; }
  if (e.target.closest('.cart-clear')) { cart = []; cartSave(); cartSync(); renderCart(); return; }
  if (e.target.closest('.cart-send')) {
    const err = document.getElementById('cart-err');
    if (!cartRole) { err.textContent = '請先選擇合作類型。'; return; }
    const msg = cartMessage(cartItems());
    if (LINE_OA_ID) { const a = document.createElement('a'); a.href = `https://line.me/R/oaMessage/${encodeURIComponent(LINE_OA_ID)}/?${encodeURIComponent(msg)}`; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); err.textContent = '已打開 LINE，確認訊息後按傳送即可。'; }
    else { (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => { err.textContent = '已複製訊息，請貼到 WeClass 官方 LINE 傳送。'; }, () => { err.textContent = msg; }); }
  }
});
renderNavDrop();
if (BASE) document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a || e.defaultPrevented) return;
  const to = hrefMap(a.getAttribute('href')); if (to) { e.preventDefault(); location.href = to; }
});
route();

/* 課程資料來源：填入「WeClass 課程資料庫」試算表部署的網頁應用程式網址後，網站會改讀試算表（讀不到時沿用內建資料） */
const DATA_URL = '';
if (DATA_URL) fetch(DATA_URL).then(r => r.json()).then(j => {
  if (!j || !Array.isArray(j.courses) || !j.courses.length) return;
  db.splice(0, db.length, ...j.courses);
  buildTags(); totalUnits = db.reduce((a, p) => a + p.units.length, 0); renderNavDrop(); renderCart();
  route();
}).catch(() => {});
</script>
