<title>WeClass 選課指南</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  WeClass 選課指南 v4.0（三種選課方式合成一頁：依主題／依年齡／依學習目標）
  從官網外連進入的課程站：課程總覽＋依學習目標找課（入口）、11 個課程方案頁。
  視覺依 Figma《維課教育｜2026網頁設計》與《WeClass Brand Guidelines Book V01》。
  官網：https://weclass.tw/（左上角 Logo 與「回官網」）
  網址：#（選課指南）、#theme／#stage／#goal（直接打開該選課方式）、#p1～#p11（方案頁）、#p1.3（方案頁並打開第 3 單元）
-->
<style id="design-tokens">
/* Layout: Figma 02 課程介紹 / 08 課程彈窗 —— 奶油底首屏、斜切皺紙色帶分段、傾斜白卡、課程彈窗 */
:root {
  color-scheme: light;
  /* 品牌色（Figma 變數組「WeClass / 品牌色彩」） */
  --teal: #1D4C58;        /* teal/600 */
  --ink: #1C4D59;         /* 文字 */
  --mint: #87CCC8;        /* mint/500，導覽選中 */
  --mint-light: #B1DBCF;  /* mint/200，相框 */
  --mint-pale: #E1F6F4;
  --orange: #F08419;      /* orange/600，按鈕 */
  --peach: #FFDBA9;       /* 重點底色、星芒 */
  --yellow: #FFE2A3;      /* 便條卡 */
  --cream: #FDEFDF;       /* 頁面底色 */
  --grey-text: #636363;   /* 卡片說明文字（Figma #757575 加深以符合對比） */
  --white: #FFFFFF;
  /* 字體（Figma 文字樣式） */
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-en: "Poppins", "Noto Sans TC", sans-serif;
  --shadow-card: 0 13px 20px 6px rgba(0, 0, 0, 0.12);
  /* 照片多邊形外框（Figma「圖片 / 課程理念介紹」的形狀） */
  --frame: polygon(20.1% 0%, 0% 18.3%, 0% 73.2%, 3.9% 89.4%, 42.7% 100%, 91.8% 91.5%, 100% 75.4%, 97.5% 18.3%, 93.7% 4%);
}
</style>
<style id="brand-assets">
/* 品牌素材（全部內嵌）：Logo、手寫標題、星芒筆刷、皺紙紋理、角色、課程照片 */
:root {
  {{ASSET_VARS}}
}
</style>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (min-width: 901px) { html { zoom: .9; } }   /* 電腦與平板整體縮小 10% */
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f-zh); font-weight: 500; font-size: 16px; line-height: 1.6; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 頁首 ── */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--cream); }
.site-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 104px; }
.logo { width: 200px; height: 58px; background: var(--logo) left center / contain no-repeat; flex: none; }
/* 導覽列：依 Figma 02 課程介紹 Desktop——粗體深綠字、加寬字距、選中為薄荷綠膠囊 */
.nav { display: flex; gap: 10px; align-items: center; }
.nav a { text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: 0.14em; color: var(--teal); padding: 7px 16px; border-radius: 999px; white-space: nowrap; transition: background .2s; }
.nav a:hover { background: var(--mint-pale); }
.nav a[aria-current="page"] { background: var(--mint); }
.nav a.official span { font-family: var(--f-en); font-size: 13px; margin-left: 2px; }

/* ── 手機漢堡選單 ── */
.burger { display: none; width: 46px; height: 46px; border: 0; border-radius: 14px; background: var(--teal); padding: 0; flex: none; position: relative; }
.burger span { position: absolute; left: 13px; width: 20px; height: 2.5px; border-radius: 2px; background: var(--white); transition: transform .25s, opacity .2s, top .25s; }
.burger span:nth-child(1) { top: 15px; } .burger span:nth-child(2) { top: 22px; } .burger span:nth-child(3) { top: 29px; }
.burger[aria-expanded="true"] span:nth-child(1) { top: 22px; transform: rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.burger[aria-expanded="true"] span:nth-child(3) { top: 22px; transform: rotate(-45deg); }
.mnav { position: absolute; left: 0; right: 0; top: 100%; background: var(--cream); box-shadow: 0 18px 24px -12px rgba(0, 0, 0, .18); max-height: calc(100dvh - 66px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 6px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); border-top: 2px dashed #EBD9C2; }
.mnav .main { display: grid; gap: 6px; margin: 10px 0 14px; }
.mnav .main a { display: flex; justify-content: space-between; align-items: center; text-decoration: none; font-weight: 900; font-size: 18px; letter-spacing: 0.06em; padding: 12px 16px; border-radius: 14px; background: var(--white); }
.mnav .main a[aria-current="page"] { background: var(--mint); }
.mnav .main a.official { background: var(--teal); color: var(--white); }
.mnav h3 { font-weight: 900; font-size: 14px; letter-spacing: 0.08em; color: var(--teal); margin: 14px 4px 8px; display: flex; gap: 8px; align-items: baseline; }
.mnav h3 small { font-weight: 700; font-size: 12px; color: var(--ink); opacity: .75; }
.mnav ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mnav ul a { display: block; text-decoration: none; font-weight: 700; font-size: 14.5px; letter-spacing: 0.04em; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .65); line-height: 1.35; }
.mnav ul a[aria-current="page"] { background: var(--teal); color: var(--white); }

/* ── 共用：標題組、膠囊、按鈕 ── */
.tgroup .en { font-family: var(--f-en); font-weight: 900; font-size: clamp(38px, 5vw, 56px); line-height: 1; color: var(--teal); margin: 0 0 14px; letter-spacing: -0.01em; }
.tgroup h2 { font-weight: 900; font-size: clamp(24px, 2.6vw, 30px); line-height: 1.3; margin: 0 0 16px; color: var(--teal); }
.tgroup p.d { font-size: 16px; letter-spacing: 0.1em; line-height: 1.75; margin: 0; max-width: 32em; }
.on-teal .tgroup .en { color: var(--white); }
.on-teal .tgroup h2 { color: var(--mint); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; padding: 5px 16px; }
.pill.teal { background: var(--teal); color: var(--white); }
.pill.white { background: var(--white); color: var(--ink); }
.pill.mint { background: var(--mint); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; font-weight: 700; font-size: 17px; letter-spacing: 0.06em; padding: 13px 28px; text-decoration: none; transition: transform .2s, background .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.orange { background: var(--orange); color: var(--ink); box-shadow: 0 8px 18px -8px rgba(240, 132, 25, .8); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--teal); }
.on-teal .btn.line { color: var(--white); box-shadow: inset 0 0 0 2px var(--white); }

/* ── 皺紙色帶 ── */
.band { position: relative; z-index: 3; }
.band.mint { background: var(--mint) var(--tx-mint) center / 768px auto; clip-path: polygon(0 34px, 100% 0, 100% 100%, 0 100%); margin-top: -34px; }
.band.peach { background: var(--peach) var(--tx-peach) center / 768px auto; clip-path: polygon(0 70px, 100% 0, 100% calc(100% - 50px), 0 100%); margin-top: -70px; }
.band.teal { background: var(--teal) var(--tx-teal) center / 768px auto; clip-path: polygon(0 0, 100% 56px, 100% 100%, 0 100%); color: var(--white); }
.band, .hero { overflow: hidden; overflow: clip; }   /* clip 不會擋住 sticky（課綱單元左側選單固定） */
/* 色帶相接：深綠區塊往上疊，避免露出米色楔形縫 */
.band + .band.teal { margin-top: -80px; clip-path: polygon(0 30px, 100% 0, 100% 100%, 0 100%); }
.band + .band.teal .wrap { padding-top: 130px; }
.band.peach + .band.teal .wrap { padding-top: 140px; }

/* ── 首屏（v2.1：縮小高度與插圖） ── */
.hero { position: relative; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); align-items: center; min-height: 380px; }
.star { position: absolute; background: center / contain no-repeat; pointer-events: none; }
.star.s1 { width: 300px; aspect-ratio: 691 / 472; left: -30px; top: 16px; background-image: var(--star1); }
.star.s2 { width: 340px; aspect-ratio: 762 / 520; right: -40px; top: 50px; background-image: var(--star2); }
.hero-copy { position: relative; z-index: 2; padding: 26px 0 70px; }
.lettering { width: min(250px, 64vw); aspect-ratio: 408 / 176; background: left center / contain no-repeat; margin-bottom: 12px; }
.lettering.learn { background-image: var(--letter-learn); }
.lettering.create { background-image: var(--letter-create); aspect-ratio: 410 / 165; }
.hero h1 { font-weight: 900; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.25; margin: 10px 0; color: var(--teal); }
.hero-copy p.d { letter-spacing: 0.08em; line-height: 1.8; margin: 0 0 20px; max-width: 34em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-girl { position: absolute; right: 2%; bottom: -66px; width: min(480px, 38vw); z-index: 1; }
.hero-cast { position: relative; z-index: 1; width: 100%; max-width: 320px; aspect-ratio: 900 / 560; background: var(--cast-group) center / contain no-repeat; justify-self: end; margin-bottom: 30px; }
.hero-framed { position: relative; z-index: 1; justify-self: end; width: 100%; max-width: 440px; margin-bottom: 50px; }
.crumb { font-size: 14px; letter-spacing: 0.08em; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumb a { text-decoration: none; border-bottom: 1px solid currentColor; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 4px; }
.stats .pill { font-size: 14px; padding: 4px 14px; }
.hl { background: linear-gradient(transparent 58%, var(--peach) 58%); font-weight: 700; }

/* 多邊形相框 */
.framed { position: relative; transform: rotate(1.5deg); aspect-ratio: 461 / 287; }
.framed::before { content: ""; position: absolute; inset: -7px; background: var(--white); clip-path: var(--frame); }
.framed img { position: relative; width: 100%; height: 100%; object-fit: cover; clip-path: var(--frame); }

/* ── 課程列表＋找課（總覽） ── */
.courses .wrap { padding-block: 84px 90px; }
.courses { scroll-margin-top: 30px; }
.courses-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 24px; margin-bottom: 22px; }
.courses-head .tgroup .en { font-size: clamp(34px, 4vw, 46px); margin-bottom: 8px; }
.courses-head .tgroup h2 { margin-bottom: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.filter-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--teal); color: var(--white); border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
.filter-btn .cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--orange); color: var(--ink); font-family: var(--f-en); font-size: 12px; padding: 0 5px; }
.filter-btn .arr { transition: transform .2s; }
.filter-btn[aria-expanded="true"] .arr { transform: rotate(180deg); }
.tag-panel { background: var(--white); border-radius: 18px; box-shadow: var(--shadow-card); padding: 18px 20px 16px; margin-bottom: 20px; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 12px 22px; align-items: start; }
.tag-panel .side { display: grid; gap: 10px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tab { border: 0; background: var(--cream); border-radius: 12px; padding: 9px 6px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; white-space: nowrap; text-align: left; padding-left: 12px; }
.tab[aria-selected="true"] { background: var(--teal); color: var(--white); }
.tab .cnt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 9px; font-family: var(--f-en); font-size: 11px; background: var(--orange); color: var(--ink); margin-left: 4px; padding: 0 4px; }
.search { display: flex; align-items: center; gap: 8px; border: 2px solid var(--mint-light); border-radius: 999px; padding: 6px 14px; }
.search input { border: 0; outline: 0; font: inherit; font-size: 15px; flex: 1; min-width: 0; background: transparent; color: var(--ink); letter-spacing: 0.04em; }
.search input::placeholder { color: #6E8388; }
.tag-list { display: flex; flex-wrap: wrap; gap: 7px; max-height: 168px; overflow-y: auto; padding: 2px; scrollbar-width: thin; align-content: flex-start; }
.tag { border: 1.5px solid #EBD9C2; background: var(--white); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 500; letter-spacing: 0.04em; transition: background .15s; }
.tag:hover { background: var(--cream); }
.tag[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--white); }
.tag .n { font-family: var(--f-en); font-size: 11px; opacity: .65; margin-left: 4px; }
.empty-hint { font-size: 14px; color: #5E7378; padding: 4px 2px; margin: 0; }
.seg { display: inline-flex; background: rgba(255, 255, 255, .7); padding: 4px; border-radius: 999px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.seg button[aria-pressed="true"] { background: var(--white); box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
.summary { font-weight: 700; letter-spacing: 0.06em; font-size: 15px; margin: 0; }
.summary b { font-family: var(--f-en); font-size: 20px; color: var(--teal); margin: 0 2px; }
.picked { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.picked .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--teal); color: var(--white); border: 0; border-radius: 999px; padding: 5px 8px 5px 13px; font-size: 14px; letter-spacing: 0.04em; }
.picked .chip i { font-style: normal; font-size: 11px; opacity: .75; }
.picked .chip span.x { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .22); font-size: 12px; }
.picked .clear { border: 0; background: transparent; text-decoration: underline; font-size: 14px; font-weight: 700; padding: 4px 6px; }

/* 方案卡：大照片＋精簡文字，一排 4 張 */
.pkg-group + .pkg-group { margin-top: 44px; }
.pkg-group h3.gt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-weight: 900; font-size: 22px; margin: 0 0 20px; color: var(--teal); }
.pkg-group h3.gt small { font-weight: 700; font-size: 14px; color: var(--ink); letter-spacing: 0.06em; }
.pkgs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 24px; }
.pkg { position: relative; background: var(--white); border-radius: 18px; box-shadow: 0 10px 18px 2px rgba(0, 0, 0, .1); padding: 12px 12px 16px; display: flex; flex-direction: column; transition: transform .25s ease, box-shadow .25s; text-decoration: none; }
.pkg:nth-child(odd) { transform: rotate(-1deg); }
.pkg:nth-child(even) { transform: rotate(1deg); }
.pkg:hover { transform: rotate(0) translateY(-5px); box-shadow: 0 18px 26px 4px rgba(0, 0, 0, .13); }
.photo { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--mint-light); }
.photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.pkg:hover .photo img { transform: scale(1.04); }
.photo .lv { position: absolute; left: 10px; bottom: 10px; background: var(--teal); color: var(--white); font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; border-radius: 8px; padding: 3px 10px; }
.pkg .body { padding: 14px 6px 0; display: flex; flex-direction: column; flex: 1; }
.pkg h4 { font-weight: 900; font-size: 19px; line-height: 1.35; color: var(--teal); margin: 0 0 6px; }
.pkg p.d { color: var(--grey-text); letter-spacing: 0.05em; line-height: 1.6; margin: 0 0 12px; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pkg .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; }
.time { font-weight: 700; font-size: 13px; color: var(--ink); background: var(--mint-pale); border-radius: 999px; padding: 4px 11px; }
.go { text-decoration: none; background: var(--orange); color: var(--ink); border-radius: 999px; font-weight: 700; font-size: 14px; padding: 6px 15px; }
.match { background: var(--cream); border-radius: 12px; padding: 9px 10px 10px; margin: 0 0 12px; }
.match .mh { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; margin: 0 0 6px; }
.match .mh b { font-family: var(--f-en); color: var(--teal); }
.match ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.match a { display: inline-block; background: var(--white); border-radius: 999px; padding: 2px 10px; font-size: 13px; text-decoration: none; letter-spacing: 0.03em; }
.match a:hover { background: var(--mint); }
.badge { position: absolute; top: -10px; right: 14px; z-index: 2; background: var(--orange); color: var(--ink); font-weight: 700; font-size: 12.5px; border-radius: 9px; padding: 4px 10px; transform: rotate(3deg); letter-spacing: 0.06em; }
.no-result { background: var(--white); border-radius: 18px; padding: 34px 30px; text-align: center; box-shadow: var(--shadow-card); }
.no-result .char { width: 100px; height: 100px; margin: 0 auto 10px; background: var(--char-max) center / contain no-repeat; }

/* ── 方案頁：簡介、單元卡、便條卡 ── */
.intro .wrap { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 56px; align-items: center; padding-block: 90px 80px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.units .wrap, .outcomes .wrap { padding-block: 120px 120px; position: relative; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px; }
.ozzi { width: 120px; aspect-ratio: 378 / 375; background: var(--ozzi-mag) center / contain no-repeat; flex: none; margin-right: 20px; }
.blob { position: absolute; width: 120px; z-index: 0; pointer-events: none; }
.blob path { fill: var(--mint); }
.cards { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px 28px; }
.card { background: var(--white); border-radius: 18px; box-shadow: 0 10px 18px 2px rgba(0, 0, 0, .1); padding: 14px 14px 20px; display: flex; flex-direction: column; transition: transform .25s ease, box-shadow .25s; }
.card:nth-child(3n+1) { transform: rotate(-1.5deg); }
.card:nth-child(3n+2) { transform: rotate(0.8deg) translateY(-6px); }
.card:nth-child(3n) { transform: rotate(1.6deg) translateY(8px); }
.card:hover { transform: rotate(0) translateY(-5px); }
.card .photo .lv { font-family: var(--f-en); font-weight: 900; font-size: 15px; padding: 4px 12px; transform: rotate(-3deg); }
.card .body { padding: 14px 6px 0; display: flex; flex-direction: column; flex: 1; }
.card h3 { font-weight: 900; font-size: 21px; line-height: 1.35; color: var(--teal); margin: 0 0 6px; }
.card p.d { color: var(--grey-text); letter-spacing: 0.06em; line-height: 1.65; margin: 0 0 14px; font-size: 14.5px; }
.card .meta { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; }
.card .more { background: var(--orange); color: var(--ink); border: 0; border-radius: 999px; font-weight: 700; font-size: 14px; padding: 7px 18px; }
.notes-sec .wrap { padding-block: 90px 100px; }
.notes-sec .tgroup { margin-bottom: 44px; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }

.cc .pic { position: relative; z-index: 2; width: 132px; height: 140px; margin-bottom: 18px; background: center bottom / contain no-repeat; transform-origin: 50% 100%; animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -0.8s); }
.cc.eng .pic { animation-name: sway; } .cc.art .pic { animation-name: sway; animation-duration: 4s; }
.cc:hover .pic { animation: hop .6s cubic-bezier(.3, 1.6, .5, 1) 1, bob 3.4s ease-in-out .6s infinite; }

/* ════════════════════════════════════════════════════════════════
   3. 篩選（規則與 v1.1 相同）
   - 勾選的標籤只要有任一個符合就列出單元
   - 比對範圍限同一分類：同一個標籤出現在兩個分類時（如「四連桿機構」）各自獨立
   ════════════════════════════════════════════════════════════════ */
const TAGS = {};   // { sci: [{tag, n}], ... } n = 出現在幾個單元
function buildTags() {
  WORLDS.forEach(w => {
    const m = new Map();
    db.forEach(p => p.units.forEach(u => u[w.key].forEach(t => m.set(t, (m.get(t) || 0) + 1))));
    TAGS[w.key] = [...m].map(([tag, n]) => ({ tag, n })).sort((a, b) => a.tag.localeCompare(b.tag, 'zh-Hant'));
  });
}
buildTags();
const state = { selected: new Set(), tab: 'sci', query: '', from: 'theme', jumpStage: '', mode: 'theme', stage: 'a6' };
try { const m0 = sessionStorage.getItem('weclass-mode'); if (['theme', 'stage', 'goal'].includes(m0)) state.mode = m0; } catch (e) {}   // 記住上次用的選課方式，課程頁的路徑才對   // selected 內容為 "sci|熱塑性塑膠"
function matchUnits() {
  const sel = [...state.selected].map(k => { const [cat, ...rest] = k.split('|'); return { cat, tag: rest.join('|') }; });
  const out = new Map();   // pkgId -> [unitIndex]
  if (!sel.length) return out;
  db.forEach(p => p.units.forEach((u, i) => {
    if (sel.some(s => u[s.cat].includes(s.tag))) { if (!out.has(p.id)) out.set(p.id, []); out.get(p.id).push(i); }
  }));
  return out;
}

/* 分齡輪播：左右鍵、圓點、慢速自動播放（滑過或觸碰就停） */
let carTimer = null;
function bindCarousel(root) {
  const track = root.querySelector('.car-track'), cards = [...track.children], dots = [...root.querySelectorAll('.car-dots b')];
  const prev = root.querySelector('.prev'), next = root.querySelector('.next');
  const step = () => cards.length > 1 ? cards[1].offsetLeft - cards[0].offsetLeft : track.clientWidth;
  const idx = () => Math.round(track.scrollLeft / step());
  const atEnd = () => track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
  const sync = () => { const i = atEnd() ? cards.length - 1 : idx(); dots.forEach((d, k) => d.classList.toggle('on', k === i)); prev.disabled = track.scrollLeft < 4; next.disabled = atEnd(); };
  const go = d => track.scrollBy({ left: d * step(), behavior: 'smooth' });
  prev.addEventListener('click', () => { stop(); go(-1); });
  next.addEventListener('click', () => { stop(); go(1); });
  track.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
  const stop = () => { clearInterval(carTimer); carTimer = null; };
  ['pointerenter', 'touchstart', 'focusin'].forEach(e => track.addEventListener(e, stop, { passive: true }));
  clearInterval(carTimer);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && track.scrollWidth > track.clientWidth + 4)
    carTimer = setInterval(() => { if (!document.body.contains(track)) return stop(); atEnd() ? track.scrollTo({ left: 0, behavior: 'smooth' }) : go(1); }, 4500);
  sync();
}

function pkgCard(p, i, hits) {
  const meta = p.type === '初階' ? `<span class="time">${p.units.length} 個單元</span>` : `<span class="time">3 天專案</span>`;

      <div class="meta">${meta}<a class="go" href="#${p.id}">看課程 →</a></div></div>
  </article>`;
}

const WORLD_EN = { sci: 'Science', eng: 'Engineering', tech: 'Technology', art: 'Art' };
function worldChars(p, interactive) {
  return `<div class="chars">${WORLDS.map(w => {
    const seen = new Map(); p.units.forEach((u, ui) => u[w.key].forEach(t => { if (!seen.has(t)) seen.set(t, []); seen.get(t).push(ui); }));
    const tags = [...seen].map(([t, us]) => interactive ? `<button class="wt" data-units="${us.join(',')}" aria-pressed="false">${esc(t)}</button>` : `<span class="wt">${esc(t)}</span>`).join('') || '<span class="wt none">本方案未涵蓋</span>';
    const [name, role] = WORLD_CHAR[w.key].who.split('・');
    return `<article class="cc ${w.key}">
      <div class="stagebox"><svg class="spot" viewBox="0 0 179 174" aria-hidden="true"><path d="${BLOB}"/></svg>
        <span class="spark s1" aria-hidden="true"></span><span class="spark s2" aria-hidden="true"></span><span class="spark s3" aria-hidden="true"></span>
        ${interactive ? '<span class="bubble" aria-hidden="true"></span>' : ''}<span class="floor" aria-hidden="true"></span>
        <div class="pic" style="background-image:var(--${WORLD_CHAR[w.key].c})" role="img" aria-label="${WORLD_CHAR[w.key].who}"></div></div>
      <div class="cbody"><p class="wen">${WORLD_EN[w.key]}</p><h3>${w.full}</h3><p class="who"><b>${name}</b>${role}</p>
        <div class="tags">${tags}</div><p class="cnt"><b>${seen.size}</b>個學習標籤</p></div></article>`;
  }).join('')}</div>${interactive ? '<p class="hint" id="wt-hint" aria-live="polite">點任一個標籤，角色會告訴你哪幾個單元有教到它。</p>' : ''}`;
}
function bindWorldChars(p) {
  const box = app.querySelector('.chars'); if (!box) return;
  const reset = '點任一個標籤，角色會告訴你哪幾個單元有教到它。';
  box.addEventListener('click', e => {
    const b = e.target.closest('button.wt'); if (!b) return;
    const on = b.getAttribute('aria-pressed') !== 'true';
    box.querySelectorAll('button.wt').forEach(x => x.setAttribute('aria-pressed', 'false'));
    box.querySelectorAll('.cc').forEach(c => c.classList.remove('active'));
    const cards = app.querySelector('.cards'); cards.classList.toggle('dim', on);
    cards.querySelectorAll('.card').forEach(c => c.classList.remove('hit'));
    const hint = document.getElementById('wt-hint');
    if (!on) { hint.textContent = reset; return; }
    b.setAttribute('aria-pressed', 'true');
    const cc = b.closest('.cc'); cc.classList.add('active');
    const us = b.dataset.units.split(',').map(Number);
    us.forEach(i => cards.children[i] && cards.children[i].classList.add('hit'));
    const list = us.map(i => `第 ${i + 1} 單元`).join('、');
    cc.querySelector('.bubble').textContent = `${list}有教！`;
    hint.innerHTML = `「${esc(b.textContent)}」出現在 ${list}。<a href="#units" onclick="document.getElementById('units').scrollIntoView();return false;">看單元 ↑</a>`;
  });
}
const WORLD_SAY = { sci: '這些是我負責的科學知識！', eng: '工程技能看這裡！', tech: '科技原理交給我！', art: '一起來創作吧！' };
function explorePanel(p) {
  const tagsOf = w => { const seen = new Map(); p.units.forEach((u, ui) => u[w.key].forEach(t => { if (!seen.has(t)) seen.set(t, []); seen.get(t).push(ui); })); return seen; };
  const first = (WORLDS.find(w => tagsOf(w).size) || WORLDS[0]).key;
  return `<aside class="wpanel" aria-label="四大學習世界標籤">
    <p class="wp-title">四大學習世界・點角色看標籤</p>
    <div class="wtabs" role="tablist">${WORLDS.map(w => `<button class="wtab ${w.key}" role="tab" data-w="${w.key}" aria-selected="${w.key === first}" aria-controls="wp-${w.key}" style="--char:var(--${WORLD_CHAR[w.key].c})"><span class="av" aria-hidden="true"></span><span class="wl">${w.name}</span></button>`).join('')}</div>
    ${WORLDS.map(w => { const seen = tagsOf(w); const [name] = WORLD_CHAR[w.key].who.split('・');
      return `<div class="wpane ${w.key}" id="wp-${w.key}" role="tabpanel" ${w.key === first ? '' : 'hidden'}><p class="say"><b>${name}</b>：${seen.size ? WORLD_SAY[w.key] : '這個方案沒有我的標籤喔！'}</p>
        <div class="tags">${[...seen].map(([t, us]) => `<button class="wt" data-k="${esc(w.key + '|' + t)}" data-units="${us.join(',')}" aria-pressed="false">${esc(t)}</button>`).join('')}</div></div>`; }).join('')}
    <p class="hint" id="wt-hint" aria-live="polite">點一個標籤，看看哪幾個單元有教到。</p>
  </aside>`;
}
function bindExplore(p) {
  const panel = app.querySelector('.wpanel'); if (!panel) return;
  const cards = app.querySelector('.ucards'), hint = document.getElementById('wt-hint');
  const reset = () => {
    panel.querySelectorAll('button.wt').forEach(x => x.setAttribute('aria-pressed', 'false'));
    cards.classList.remove('dim'); cards.querySelectorAll('.card').forEach(c => c.classList.remove('hit'));
    cards.querySelectorAll('.ut.on').forEach(x => x.classList.remove('on'));
    hint.textContent = '點一個標籤，看看哪幾個單元有教到。';
  };
  panel.addEventListener('click', e => {
    const tab = e.target.closest('.wtab');
    if (tab) {
      panel.querySelectorAll('.wtab').forEach(x => x.setAttribute('aria-selected', x === tab));
      panel.querySelectorAll('.wpane').forEach(x => x.hidden = x.id !== 'wp-' + tab.dataset.w);
      return;
    }
    if (e.target.closest('.clear-tag')) { reset(); return; }
    const b = e.target.closest('button.wt'); if (!b) return;
    const on = b.getAttribute('aria-pressed') !== 'true';
    reset(); if (!on) return;
    b.setAttribute('aria-pressed', 'true');
    const w = b.dataset.k.split('|')[0], us = b.dataset.units.split(',').map(Number);
    cards.classList.add('dim');
    us.forEach(i => { const c = cards.children[i]; if (!c) return; c.classList.add('hit'); const pk = c.querySelector('.peek'); pk.className = 'peek ' + w; pk.style.setProperty('--char', `var(--${WORLD_CHAR[w].c})`); });
    cards.querySelectorAll('.ut').forEach(x => x.classList.toggle('on', x.dataset.k === b.dataset.k));
    hint.innerHTML = `「${esc(b.textContent)}」在 ${us.map(i => `第 ${i + 1} 單元`).join('、')}<button class="clear-tag">取消</button>`;
    // 讓第一個被認領的單元出現在面板旁（桌機）或面板下方（手機／平板），兩者同時看得到
    const c0 = cards.children[us[0]], r = c0.getBoundingClientRect(), pr = panel.getBoundingClientRect();
    const stacked = pr.right > cards.getBoundingClientRect().left + 10;
    const minTop = stacked ? pr.bottom + 34 : 130;
    if (r.top < minTop || r.top > innerHeight - 160) window.scrollBy({ top: r.top - minTop, behavior: 'smooth' });
  });
  cards.addEventListener('click', e => {
    const b = e.target.closest('.more'); if (!b) return;
    const open = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', open); document.getElementById(b.getAttribute('aria-controls')).hidden = !open;
  });
}
function openInline(p, i) {
  if (p.type === '進階') { const el = document.getElementById('project'); if (el) el.scrollIntoView({ block: 'center', behavior: 'instant' }); return; }
  const c = app.querySelector('.ucards').children[i]; if (!c) return;
  const b = c.querySelector('.more'); b.setAttribute('aria-expanded', 'true'); document.getElementById(b.getAttribute('aria-controls')).hidden = false;
  c.scrollIntoView({ block: 'center', behavior: 'instant' });
  c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600);
}
function similarPkgs(p, n = 3) {
  const key = x => new Set(x.units.flatMap(u => WORLDS.flatMap(w => u[w.key].map(t => w.key + '|' + t))));
  const mine = key(p);
  return db.filter(x => x !== p).map(x => { const k = key(x); let s = 0; k.forEach(t => mine.has(t) && s++); return { x, s }; })
    .sort((a, b) => b.s - a.s || (a.x.type === p.type ? -1 : 1)).slice(0, n);
}
function relatedPacks(p) {
  const top = WORLDS.flatMap(w => [...new Set(p.units.flatMap(u => u[w.key]))].slice(0, 1).map(t => w.key + '|' + t));
  const sims = similarPkgs(p);
  return `<section class="band peach related" aria-labelledby="rl-title">
    <div class="wrap">
      <div class="sec-head"><div class="tgroup"><p class="en" aria-hidden="true">Related Packs</p><h2 id="rl-title">相關組合包</h2><p class="d">和「${esc(p.title)}」學習標籤最接近的三個課程方案，適合搭配成一學期的課程。</p></div>
        <a class="btn orange" href="#" data-tags="${esc(top.join(';'))}">用本方案的學習目標找單元 →</a></div>
      <div class="pkgs three">${sims.map(({ x, s }, i) => pkgCard(x, i, null).replace('<div class="body">', s ? `<div class="body"><span class="share">${s} 個共同學習標籤</span>` : '<div class="body">')).join('')}</div>
    </div>
  </section>`;
}
function bindRelated() {
  app.querySelectorAll('[data-tags]').forEach(a => a.addEventListener('click', () => { state.selected = new Set(a.dataset.tags.split(';').filter(Boolean)); state.query = ''; }));
  app.querySelectorAll('.rcard[data-stage]').forEach(a => a.addEventListener('click', () => { state.jumpStage = a.dataset.stage; }));
}

  </div></section>`;
}
const uniq = a => [...new Set(a)];
function packageFaq(p) {
  const items = [[`「${p.title}」適合幾歲的孩子？`, `適合 ${esc(p.grades)} 的孩子，屬於 WeClass 的${p.type}課程方案。`]];
  if (p.type === '進階') {
    items.push(['課程怎麼安排、需要多少時間？', `這是 3 天的跨日大型專案（XPBL）。${(p.schedule || []).map(d => `${esc(d.day)}：${d.items.map(esc).join('、')}`).join('；')}。`]);
  } else {
    const m = minutes(p);
    items.push(['一共有幾個單元、需要多少時間？', `共 ${p.units.length} 個實作單元，合計 ${m} 分鐘（相當於 ${Math.round(m / 90)} 堂 90 分鐘的課）：${p.units.map(u => `${esc(u.title)}（${esc(u.duration)}）`).join('、')}。`]);
  }
  const t = k => uniq(p.units.flatMap(u => u[k])).map(esc).join('、') || '—';
  items.push(['孩子會學到哪些知識與技能？', `依四大學習世界整理：科學／化學：${t('sci')}；工程：${t('eng')}；科技：${t('tech')}；藝術：${t('art')}。`]);
  if ((p.requirements || []).length) items.push(['上課需要準備什麼？', p.requirements.map(esc).join('；') + '。']);
  items.push(['學校或安親班想開這門課，要怎麼洽詢？', 'WeClass 提供常態課程、課後社團與冬夏令營的規劃。加入 WeClass 官方 LINE，教育顧問會與您聯繫並提供機構合作方案。']);
  return items;
}

      <div class="cards">${p.outcomes.map((o, i) => `
        <article class="card">
          <div class="photo"><img src="${unitPhoto({ title: o.title }, i)}" alt="" loading="lazy"><span class="lv">Skill ${pad(i + 1)}</span></div>
          <div class="body"><h3>${esc(o.title)}</h3><p class="d">${esc(o.desc)}</p></div>

  </section>
  ${schedSection(p, '三天的大型專案，從設計、組裝到程式撰寫與成果發表。', ' style="margin-top:-70px"')}
  <section class="notes-sec" aria-labelledby="rq-title">
    <div class="wrap">

        <article class="note y" style="grid-row:span 2">
          <span class="req-ozzi" aria-hidden="true"></span>

          <ul class="check">${p.requirements.map(r => `<li>${esc(r)}</li>`).join('')}</ul>

          <p class="tiny">Project</p><h3>${esc(u.title)}<span class="n">${esc(u.duration)}</span></h3>
          <p style="margin:0 0 16px;letter-spacing:.08em;font-weight:700">${esc(u.desc)}</p>
          <div class="kv"><span class="pill teal">科學知識</span><span>${esc(u.sci_desc)}</span><span class="pill teal">技能訓練</span><span>${esc(u.skill_desc)}</span></div>
        </article>
      </div>

  </section>
  <section class="notes-sec" aria-labelledby="wd-title" style="padding-top:0">
    <div class="wrap" style="padding-top:0">
      <div class="tgroup"><p class="en" aria-hidden="true">Four Worlds</p><h2 id="wd-title">四大學習世界</h2><p class="d">這個專案涵蓋的學習標籤。</p></div>
      ${worldChars(p, false)}

  ${faqSection(packageFaq(p))}

  ${ctaBand({ pager })}`;
}

// 官方 LINE 連結：請換成正式的加入好友網址（例如 https://lin.ee/xxxx）
const LINE_URL = 'https://line.me/R/ti/p/%40238hxhaz';   // WeClass 官方 LINE 加入好友

        <a class="btn orange" href="${LINE_URL}" target="_blank" rel="noopener">加入官方 LINE，索取【最新機構合作方案】<span aria-hidden="true">↗</span></a>

/* ════════════════════════════════════════════════════════════════
   6. 單元彈窗
   ════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════
   7. 路由：# → 總覽、#find → 總覽並捲到找課、#p1 → 方案頁、#p1.3 → 方案頁＋第 3 單元
   ════════════════════════════════════════════════════════════════ */
/* 電腦版導覽列「全部課程方案」的下拉選單：分初階、進階列出每個方案，任何一頁都能直接換課程 */
function navDropHtml() {
  const col = (type, note) => `<div class="nd-col"><p class="nd-h">${type}課程<small>${note}</small></p><ul>${db.filter(p => p.type === type).map(p => `<li><a href="#${p.id}" data-pid="${p.id}"><span>${esc(p.title)}</span><small>${esc(p.grades)}</small></a></li>`).join('')}</ul></div>`;
  return col('初階', '單元實作') + col('進階', '3 天專案') + '<a class="nd-all" href="#theme">看全部課程方案 →</a>';
}
function renderNavDrop() {
  const el = document.getElementById('navdrop'); if (!el) return;
  el.innerHTML = navDropHtml();
  const cur = (location.hash.match(/^#(p\d+)/) || [])[1] || (BASE ? (db.find(p => decodeURIComponent(location.pathname).includes('/' + slugOf(p) + '/')) || {}).id : '');
  el.querySelectorAll('[data-pid]').forEach(a => a.toggleAttribute('aria-current', a.dataset.pid === cur));
}
window.addEventListener('hashchange', renderNavDrop);

function setNav(which) {
  ['goal', 'all'].forEach(k => { const el = document.getElementById('nav-' + k); if (k === which) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current'); });
}
/* 手機漢堡選單 */
const burger = document.getElementById('burger'), mnav = document.getElementById('mnav');
function renderMnav() {
  const h = location.hash.replace('#', '').split('.')[0];
  const grp = type => db.filter(p => p.type === type).map(p => `<li><a href="#${p.id}"${h === p.id ? ' aria-current="page"' : ''}>${esc(p.title)}</a></li>`).join('');
  mnav.innerHTML = `<div class="main"><a href="#"${!/^p\d/.test(h) ? ' aria-current="page"' : ''}>選課指南<span aria-hidden="true">→</span></a>${MODES.map(m => `<a href="#${m.id}" class="sub">${m.name}<span aria-hidden="true">→</span></a>`).join('')}<a href="https://weclass.tw/" class="official">回 WeClass 官網<span aria-hidden="true">↗</span></a></div>
    <h3>初階課程<small>1~6 年級</small></h3><ul>${grp('初階')}</ul>
    <h3>進階課程<small>9~15 歲</small></h3><ul>${grp('進階')}</ul>`;
}
function setMenu(open) {
  if (open) renderMnav();
  mnav.hidden = !open; burger.setAttribute('aria-expanded', open); burger.setAttribute('aria-label', open ? '關閉選單' : '開啟選單');
}
burger.addEventListener('click', () => setMenu(mnav.hidden));
mnav.addEventListener('click', e => { const a = e.target.closest('a'); if (a) { setMenu(false); if (a.getAttribute('href') === '#' && location.hash === '') renderHome(state.mode); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mnav.hidden) { setMenu(false); burger.focus(); } });
document.addEventListener('click', e => { if (!mnav.hidden && !e.target.closest('.site-head')) setMenu(false); });
window.matchMedia('(min-width: 901px)').addEventListener('change', e => { if (e.matches) setMenu(false); });

function route() {
  if (!mnav.hidden) setMenu(false);
  const h = location.hash.replace('#', '');
  if (BASE) {
    const legacy = /^(p\d+(\.\d+)?|all)$/.test(h) ? hrefMap('#' + h) : null;
    if (legacy) { location.replace(legacy); return; }
    const path = decodeURIComponent(location.pathname), at = path.indexOf(BASE);
    const rest = (at >= 0 ? path.slice(at + BASE.length) : '').replace(/index\.html$/, '').replace(/\/$/, '');
    const pk = db.find(x => slugOf(x) === rest), un = (h.match(/^u(\d+)$/) || [])[1];
    if (pk) renderPackage(pk, un ? +un : 0);
    else renderHome(MODE_IDS.includes(h) ? h : (h === 'find' ? 'goal' : 'theme'));
    return;
  }
  const m = h.match(/^(p\d+)(?:\.(\d+))?$/);
  const p = m && db.find(x => x.id === m[1]);
  if (p) renderPackage(p, m[2] ? +m[2] : 0);
  else renderHome(MODE_IDS.includes(h) ? h : (h === 'find' ? 'goal' : h === 'all' ? 'theme' : state.mode));
}
window.addEventListener('hashchange', route);
/* ════ 我的課程清單：勾選有興趣的方案或單元，選身份後用官方 LINE 傳給顧問 ════ */
const LINE_OA_ID = '@238hxhaz';   // WeClass 官方 LINE 帳號 ID
const ROLES = ['企業合作', '教材採購', '營隊合作'];
const CART_KEY = 'weclass-cart-v1';
let cart = [], cartRole = '', cartOpen = false;
try { const s = JSON.parse(localStorage.getItem(CART_KEY) || '{}'); cart = Array.isArray(s.items) ? s.items : []; cartRole = s.role || ''; } catch (e) {}
const cartSave = () => { try { localStorage.setItem(CART_KEY, JSON.stringify({ items: cart, role: cartRole })); } catch (e) {} };
function cartFind(key) {
  const [k, id] = key.split(':');
  if (k === 'p') { const p = db.find(x => x.id === id); return p && { key, kind: 'p', p }; }
  for (const p of db) { const u = p.units.find(x => x.id === id); if (u) return { key, kind: 'u', p, u }; }
  return null;
}
function cartBtn(key, mini) {
  const on = cart.includes(key), pack = key[0] === 'p';
  return `<button type="button" class="addc${mini ? ' mini' : ''}${pack ? ' pack' : ''}" data-ck="${key}" aria-pressed="${on}">${on ? (pack ? '已加入整個方案 ✓' : '已加入 ✓') : (pack ? '＋ 加入整個方案' : '＋ 加入清單')}</button>`;
}
function cartSync() { document.querySelectorAll('[data-ck]').forEach(b => { const tmp = document.createElement('div'); tmp.innerHTML = cartBtn(b.dataset.ck, b.classList.contains('mini')); const n = tmp.firstChild; b.setAttribute('aria-pressed', n.getAttribute('aria-pressed')); b.textContent = n.textContent; }); }
function cartItems() { return cart.map(cartFind).filter(Boolean); }
function cartTotal(items) {
  const packs = new Set(items.filter(x => x.kind === 'p').map(x => x.p.id));
  let m = 0, days = 0;
  items.forEach(x => {
    if (x.kind === 'p') { if (x.p.type === '進階') days += 3; else m += minutes(x.p); }
    else if (!packs.has(x.p.id)) { const n = parseInt(x.u.duration, 10); if (n) m += n; else days += 3; }
  });
  return { m, days, text: [m ? `${m} 分鐘` : '', days ? `${days} 天專案` : ''].filter(Boolean).join('＋') || '—' };
}
function cartMessage(items) {
  const lines = items.map(x => x.kind === 'p' ? `・${x.p.title}（整個方案・${x.p.type === '進階' ? '3 天專案' : `${x.p.units.length} 個單元・${minutes(x.p)} 分鐘`}）` : `・${x.u.title}（${x.p.title}・${x.u.duration}）`);
  return `您好，我想詢問「${cartRole}」：\n${lines.join('\n')}\n合計約 ${cartTotal(items).text}\n（來自 WeClass 課程網站）`;
}
function renderCart() {
  let el = document.getElementById('cart');
  if (!el) { el = document.createElement('aside'); el.id = 'cart'; el.className = 'cart'; el.setAttribute('aria-label', '我的課程清單'); document.body.appendChild(el); }
  const items = cartItems();
  if (!items.length) { el.hidden = true; cartOpen = false; return; }
  el.hidden = false; el.classList.toggle('open', cartOpen);
  const tot = cartTotal(items);
  el.innerHTML = `<button type="button" class="cart-bar" aria-expanded="${cartOpen}"><span>我的課程清單<b>${items.length}</b></span><small>${tot.text}</small><span class="cv" aria-hidden="true">${cartOpen ? '▾' : '▴'}</span></button>
    <div class="cart-body"${cartOpen ? '' : ' hidden'}>
      <ol>${items.map(x => `<li><span><b>${esc(x.kind === 'p' ? x.p.title : x.u.title)}</b><small>${x.kind === 'p' ? '整個方案・' + (x.p.type === '進階' ? '3 天專案' : minutes(x.p) + ' 分鐘') : esc(x.p.title) + '・' + esc(x.u.duration)}</small></span><button type="button" class="rm" data-rm="${x.key}" aria-label="移除 ${esc(x.kind === 'p' ? x.p.title : x.u.title)}">✕</button></li>`).join('')}</ol>
      <p class="cart-q">您是哪一種合作？</p>
      <div class="roles" role="radiogroup">${ROLES.map(r => `<button type="button" role="radio" data-role="${r}" aria-checked="${cartRole === r}">${r}</button>`).join('')}</div>
      <p class="cart-err" id="cart-err" aria-live="polite"></p>
      <p class="cart-tip">傳送前請在 LINE 聊天室上方按「加入好友」，顧問才能回覆您。</p>
      <button type="button" class="cart-send">用 LINE 傳給 WeClass 顧問</button>
      <div class="cart-qr" id="cart-qr" hidden></div>
      <button type="button" class="cart-clear">清空清單</button>
    </div>`;
}
function cartToggle(key) { cart = cart.includes(key) ? cart.filter(k => k !== key) : [...cart, key]; cartSave(); cartSync(); if (cart.length === 1 && cart.includes(key)) cartOpen = false; renderCart(); }
document.addEventListener('click', e => {
  const add = e.target.closest('.addc');
  if (add) { e.preventDefault(); e.stopPropagation(); cartToggle(add.dataset.ck); const bar = document.querySelector('#cart .cart-bar'); if (bar) { bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); } return; }
  const c = e.target.closest('#cart'); if (!c) return;
  if (e.target.closest('.cart-bar')) { cartOpen = !cartOpen; renderCart(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { cartToggle(rm.dataset.rm); return; }
  const role = e.target.closest('[data-role]'); if (role) { cartRole = role.dataset.role; cartSave(); renderCart(); return; }
  if (e.target.closest('.cart-clear')) { cart = []; cartSave(); cartSync(); renderCart(); return; }
  if (e.target.closest('.cart-send')) {
    const err = document.getElementById('cart-err');
    if (!cartRole) { err.textContent = '請先選擇合作類型。'; return; }
    const msg = cartMessage(cartItems());
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const chatUrl = `https://line.me/R/oaMessage/${encodeURIComponent(LINE_OA_ID)}/?${encodeURIComponent(msg)}`;
    if (isMobile) { location.href = chatUrl; err.textContent = '已打開 LINE：先按上方「加入好友」，再按傳送。'; return; }
    // 電腦版：QR Code 直接帶入課程清單；手機掃描後會打開 LINE 聊天室、訊息已填好
    const qr = document.getElementById('cart-qr'); qr.hidden = false;
    const friendUrl = 'https://line.me/R/ti/p/' + encodeURIComponent(LINE_OA_ID);
    // QR Code 內的中文直接用 UTF-8（不轉成 %XX），資料量少三分之二，圖案才不會太密
    const qrUrl = 'https://line.me/R/oaMessage/' + encodeURIComponent(LINE_OA_ID) + '/?' + msg.replace(/[%\s&#+?\/\\]/g, c => encodeURIComponent(c));
    const withMsg = new TextEncoder().encode(qrUrl).length <= 700;   // 清單太長時改用加好友＋貼上
    let svg = '';
    try { qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; const q = qrcode(0, 'L'); q.addData(withMsg ? qrUrl : friendUrl, 'Byte'); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }); } catch (x) {}
    qr.innerHTML = withMsg
      ? `<p><b>用手機相機或 LINE 掃描</b>會打開 WeClass 官方 LINE，課程清單已經填好，加入好友後按傳送即可。</p><div class="qr-img">${svg}</div><a href="${friendUrl}" target="_blank" rel="noopener">或在電腦版 LINE 開啟 ↗</a>`
      : `<p><b>用手機掃描，加入 WeClass 官方 LINE</b>清單較長，訊息已複製，加入好友後貼上傳送即可。</p><div class="qr-img">${svg}</div><a href="${friendUrl}" target="_blank" rel="noopener">或在電腦版 LINE 開啟 ↗</a>`;
    requestAnimationFrame(() => qr.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
    (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => { err.textContent = '已複製課程清單訊息。'; }, () => { err.textContent = msg; });
  }
});
renderNavDrop();
if (BASE) document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a || e.defaultPrevented) return;
  const to = hrefMap(a.getAttribute('href')); if (to) { e.preventDefault(); location.href = to; }
});
route();

/* 課程資料來源：填入「WeClass 課程資料庫」試算表部署的網頁應用程式網址後，網站會改讀試算表（讀不到時沿用內建資料） */
const DATA_URL = '';
if (DATA_URL) fetch(DATA_URL).then(r => r.json()).then(j => {
  if (!j || !Array.isArray(j.courses) || !j.courses.length) return;
  db.splice(0, db.length, ...j.courses);
  buildTags(); totalUnits = db.reduce((a, p) => a + p.units.length, 0); renderNavDrop(); renderCart();
  route();
}).catch(() => {});
</script>
