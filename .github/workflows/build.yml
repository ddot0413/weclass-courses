# 自動產生課程網站並發布到 GitHub Pages
# 每天台灣時間凌晨 3 點從試算表讀最新課程重新產生；也可以在 Actions 頁面按「Run workflow」立即更新。
# 正式網址 https://courses.weclass.tw/（GitHub › Settings › Pages 的 Custom domain 要填 courses.weclass.tw，
# GoDaddy 的 DNS 要有一筆 CNAME：courses → ddot0413.github.io）。舊的 ddot0413.github.io/weclass-courses/ 會自動轉過來。
name: Build course site
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.47.0 qrcode==7.4.2 && python -m playwright install --with-deps chromium
      - name: Build
        env:
          DATA_URL: https://script.google.com/macros/s/AKfycbwsQRRy-7l0NSfUNeplodcIuVzs3QbhbsmuY5Win1jBUnvCp8h_K8jPLLPzFG4pRr0X/exec
          SITE_ORIGIN: https://courses.weclass.tw
          SITE_BASE: /
        run: python build.py --origin "$SITE_ORIGIN" --base "$SITE_BASE" --data-url "$DATA_URL" --live-data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
