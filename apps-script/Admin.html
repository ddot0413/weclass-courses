<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeClass 課程後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Poppins:wght@700;900&display=swap">
<style>
/* 版面：頂部工具列 → 左側清單（主題課程／單元課程）｜右側編輯表單 */
:root {
  --teal: #1D4C58; --ink: #1C4D59; --mint: #87CCC8; --mint-pale: #E1F6F4;
  --orange: #F08419; --peach: #FFDBA9; --cream: #FDEFDF; --paper: #FFFFFF;
  --line: #E8DCCB; --field: #FBF7F2; --muted: #5E7378; --danger: #B3261E;
  --w-sci: #E3F4F2; --w-sci-d: #1D6A6B; --w-eng: #FDEBD6; --w-eng-d: #A04F00;
  --w-tech: #DCEBEF; --w-tech-d: #1C4D59; --w-art: #FCF0D3; --w-art-d: #8A5A00;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-en: "Poppins", "Noto Sans TC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f-zh); font-weight: 500; font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 20; background: var(--teal); color: #fff; }
.top .in { display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
.brand { font-family: var(--f-en); font-weight: 900; font-size: 18px; }
.brand small { font-family: var(--f-zh); font-weight: 700; font-size: 13px; color: var(--mint); margin-left: 8px; }
.top .sp { flex: 1; }
.state { font-size: 13px; font-weight: 700; color: var(--mint); white-space: nowrap; }
.state.dirty { color: var(--peach); }
.btn { border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 900; letter-spacing: .04em; white-space: nowrap; }
.btn.pub { background: var(--orange); color: var(--ink); }
.btn.pub:disabled { opacity: .55; cursor: default; }
.btn.soft { background: var(--mint-pale); color: var(--teal); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }

.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; padding: 18px 16px 40px; max-width: 1240px; margin: 0 auto; align-items: start; }
.layout > * { min-width: 0; }
.panel { background: var(--paper); border-radius: 18px; box-shadow: 0 10px 22px -12px rgba(28, 77, 89, .3); }

/* 左側清單 */
.list { position: sticky; top: 70px; padding: 14px; max-height: calc(100vh - 90px); overflow: auto; }
.new { display: grid; gap: 8px; margin-bottom: 14px; }
.new button { border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 900; text-align: left; letter-spacing: .04em; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.new button small { font-weight: 700; font-size: 11.5px; opacity: .85; letter-spacing: 0; }
.new .nt { background: var(--orange); color: var(--ink); }
.new .nu { background: var(--teal); }
.ltabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 10px; }
.ltabs button { border: 0; background: transparent; border-radius: 9px; padding: 7px 4px; font-weight: 900; font-size: 13.5px; }
.ltabs button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.ltabs i { font-style: normal; font-family: var(--f-en); font-size: 11px; margin-left: 4px; opacity: .8; }
.list .search { width: 100%; border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; background: var(--field); margin-bottom: 8px; }
.grp { font-size: 12px; font-weight: 900; color: var(--muted); letter-spacing: .1em; margin: 12px 6px 6px; }
.item { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 8px 10px; }
.item:hover { background: var(--cream); }
.item[aria-current="true"] { background: var(--mint-pale); box-shadow: inset 3px 0 0 var(--teal); }
.item .th { width: 38px; height: 38px; border-radius: 10px; flex: none; background: var(--mint) center / cover; }
.item.u .th { width: 30px; height: 30px; border-radius: 8px; background-color: var(--mint-pale); }
.item b { display: block; font-size: 14px; font-weight: 900; line-height: 1.3; }
.item small { color: var(--muted); font-size: 12px; font-weight: 700; }
.item .warn { color: var(--danger); }
.item .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: none; }

/* 編輯表單 */
.editor { padding: 22px 24px 26px; }
.ed-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.kind { display: inline-block; font-size: 12px; font-weight: 900; letter-spacing: .08em; border-radius: 999px; padding: 3px 11px; margin-bottom: 6px; }
.kind.t { background: var(--peach); color: #8A4A00; } .kind.u { background: var(--mint-pale); color: var(--teal); }
.ed-head h1 { margin: 0; font-size: 24px; font-weight: 900; color: var(--teal); line-height: 1.3; }
.back { border: 0; background: var(--field); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; }
fieldset { min-width: 0; border: 0; padding: 18px 0 0; margin: 0 0 18px; border-top: 1px solid var(--line); }
fieldset:first-of-type { border-top: 0; padding-top: 0; }
legend { font-weight: 900; font-size: 16px; color: var(--teal); letter-spacing: .06em; padding: 0; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; float: left; width: 100%; }
legend + * { clear: both; }
legend .req { font-size: 11.5px; background: var(--danger); color: #fff; border-radius: 6px; padding: 1px 7px; letter-spacing: .04em; }
legend .hint { font-weight: 700; letter-spacing: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; }
.f { display: grid; gap: 5px; margin-bottom: 12px; }
.f > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.f input, .f select, .f textarea { width: 100%; border: 1.5px solid var(--line); background: var(--field); border-radius: 10px; padding: 9px 12px; font-weight: 700; }
.f textarea { resize: vertical; min-height: 64px; font-weight: 500; line-height: 1.6; }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--teal); background: #fff; outline: none; box-shadow: 0 0 0 3px var(--mint-pale); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--field); border: 1.5px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 14px; font-weight: 900; }
.seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }
.lvls { display: flex; gap: 8px; flex-wrap: wrap; }
.lvls button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 16px; font-weight: 900; font-size: 15px; display: grid; text-align: left; line-height: 1.25; min-width: 112px; }
.lvls button small { font-family: var(--f-en); font-size: 12px; font-weight: 700; color: var(--muted); }
.lvls button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.lvls button[aria-pressed="true"] small { color: var(--mint); }
.lvls.err button { border-color: var(--danger); }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.hint.err { color: var(--danger); font-weight: 700; }
.cover { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; align-items: center; }
.drop { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; border: 2px dashed var(--line); background: var(--field) center / cover no-repeat; display: grid; place-items: center; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; overflow: hidden; }
.drop.has { border-style: solid; border-color: transparent; color: transparent; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop:hover { border-color: var(--teal); }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }

/* 主題課程裡的單元清單 */
.ulist { display: grid; gap: 6px; }
.urow { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 7px 8px 7px 10px; }
.u-no { font-family: var(--f-en); font-weight: 900; font-size: 11.5px; background: var(--teal); color: #fff; border-radius: 7px; padding: 2px 8px; flex: none; }
.urow .nm { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0; }
.urow .nm b { display: block; font-weight: 900; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.urow .nm small { color: var(--muted); font-size: 12px; font-weight: 700; }
.urow .nm:hover b { text-decoration: underline; }
.tools { display: flex; gap: 4px; flex: none; }
.ic { width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--field); font-size: 14px; line-height: 1; display: grid; place-items: center; }
.ic:hover { background: var(--mint-pale); }
.ic:disabled { opacity: .3; cursor: default; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.dash { border: 2px dashed var(--line); background: transparent; border-radius: 12px; padding: 9px 14px; font-weight: 900; color: var(--teal); }
.dash:hover { border-color: var(--teal); }
.addrow select { flex: 1; min-width: 200px; border: 1.5px solid var(--line); background: var(--field); border-radius: 12px; padding: 8px 10px; font-weight: 700; color: var(--teal); }

/* 課表 */
.auto { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--mint-pale); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13.5px; font-weight: 700; }
.auto input { width: 64px; border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 8px; font-weight: 700; background: #fff; }

.auto .btn { margin-left: auto; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.day { background: var(--field); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.day-h { display: flex; gap: 6px; align-items: center; }
.day-h .no { font-family: var(--f-en); font-weight: 900; font-size: 12px; color: var(--orange); flex: none; }
.day-h input { flex: 1; min-width: 0; border: 0; background: transparent; font-weight: 900; font-size: 15px; color: var(--teal); padding: 4px 2px; border-bottom: 1.5px dashed transparent; }
.day-h input:hover, .day-h input:focus { border-bottom-color: var(--line); outline: none; }
.slot { display: grid; grid-template-columns: 62px minmax(0, 1fr) 26px; gap: 5px; align-items: center; }
.slot input { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 7px; font-size: 13.5px; font-weight: 700; min-width: 0; }
.slot input:focus { border-color: var(--teal); outline: none; }
.slot .ic { width: 26px; height: 26px; font-size: 12px; background: transparent; }
.day .dash { padding: 5px; font-size: 13px; border-radius: 8px; }
.day-del { align-self: flex-end; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; text-decoration: underline; padding: 2px; }
.add-day { min-height: 120px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.sum b { color: var(--teal); }
.sum .err { color: var(--danger); }

/* 單元標籤 */
.durs { display: flex; flex-wrap: wrap; gap: 6px; }
.durs button { border: 1.5px solid var(--line); background: var(--field); border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 13.5px; }
.durs button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.worlds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.wbox { border-radius: 12px; padding: 10px; }
.wbox.sci { background: var(--w-sci); --d: var(--w-sci-d); } .wbox.eng { background: var(--w-eng); --d: var(--w-eng-d); }
.wbox.tech { background: var(--w-tech); --d: var(--w-tech-d); } .wbox.art { background: var(--w-art); --d: var(--w-art-d); }
.wbox > b { display: block; font-size: 12.5px; font-weight: 900; color: var(--d); margin-bottom: 6px; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--d); color: #fff; border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12.5px; font-weight: 700; }
.chip button { border: 0; background: rgba(255, 255, 255, .25); color: #fff; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; line-height: 1; padding: 0; }
.tagin { position: relative; flex: 1; min-width: 110px; }
.tagin input { width: 100%; border: 1.5px dashed color-mix(in srgb, var(--d) 40%, transparent); background: rgba(255, 255, 255, .7); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.tagin input:focus { outline: none; border-style: solid; background: #fff; }
.sugg { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border-radius: 10px; box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .25); padding: 4px; max-height: 180px; overflow: auto; }
.sugg button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 13px; }
.sugg button:hover { background: var(--cream); }
.sugg small { color: var(--muted); margin-left: 6px; }
.durs .custom { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; }
.durs .custom input { width: 84px; border: 1.5px solid var(--teal); border-radius: 999px; padding: 4px 10px; font-weight: 700; }
.inherit { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.inherit span { background: var(--mint-pale); border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 700; }

.danger-zone { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; flex-wrap: wrap; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }

.toast { position: fixed; z-index: 50; left: 50%; bottom: 22px; translate: -50% 0; background: var(--teal); color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 999px; box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .4); opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
.toast.on { opacity: 1; transform: none; }
.toast.bad { background: var(--danger); }
.note { margin: 0 auto; max-width: 1240px; padding: 0 16px 30px; font-size: 13px; color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .list { position: static; max-height: none; }
  .new { grid-template-columns: 1fr 1fr; }
  .new button small { display: none; }
  .items { max-height: 260px; overflow: auto; }
  .editor { padding: 18px 14px; }
  .row, .worlds, .cover { grid-template-columns: 1fr; }
  .brand small { display: none; }
  .state { white-space: normal; font-size: 12px; line-height: 1.3; text-align: right; }
  .auto .btn { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head><body>

<header class="top"><div class="in">
  <span class="brand">WeClass<small>課程後台</small></span>
  <span class="sp"></span>
  <span class="state" id="state" aria-live="polite">所有變更已發布</span>
  <button class="btn pub" id="publish" type="button" disabled>發布到網站</button>
</div></header>

<main class="layout">
  <nav class="panel list" aria-label="課程清單">
    <div class="new">
      <button class="nt" id="new-theme" type="button">＋ 新增主題課程<small>一整包課</small></button>
      <button class="nu" id="new-unit" type="button">＋ 新增單元課程<small>單堂課</small></button>
    </div>
    <div class="ltabs" role="group" aria-label="清單切換">
      <button type="button" data-tab="theme" aria-pressed="true">主題課程<i id="n-theme"></i></button>
      <button type="button" data-tab="unit" aria-pressed="false">單元課程<i id="n-unit"></i></button>
    </div>
    <input class="search" id="search" type="search" placeholder="搜尋課程名稱" aria-label="搜尋課程名稱">
    <div class="items" id="items"></div>
  </nav>
  <section class="panel editor" id="editor" aria-label="編輯課程"></section>
</main>
<p class="note" id="note">修改會先暫存在這個視窗，按右上角「發布到網站」才會寫回試算表，網站約 5 分鐘內更新。關閉視窗前記得先發布。</p>
<div class="toast" id="toast" role="status"></div>

<script>
/* 照片欄位只填檔名時（例如 u-p1-2.jpg），代表放在網站的 assets 資料夾；網站換網址時，改這一行 */
const SITE_ASSETS = 'https://ddot0413.github.io/weclass-courses/assets/';
const IMG = v => !v ? '' : /^(https?:|data:)/.test(v) ? v : SITE_ASSETS + v;

const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const SAMPLE = [];   // 只在本機預覽時使用；在試算表裡會改讀試算表資料
const WORLDS = [['sci', '科學/化學世界'], ['eng', '工程世界'], ['tech', '科技世界'], ['art', '藝術世界']];
const LEVELS = [{ k: '低年級', g: [1, 2] }, { k: '中年級', g: [3, 4] }, { k: '高年級', g: [5, 6] }];
const DURS = ['30分鐘', '60分鐘', '90分鐘', '180分鐘', '270分鐘', '跨日大型專案'];
const OLD_GRADES = { '1~3年級': ['低年級'], '1~6年級': ['低年級', '中年級', '高年級'], '3~6年級': ['中年級', '高年級'], '9~15歲': ['高年級'] };
let data = [], loose = [], tab = 'theme', view = null, dirty = 0, triedPublish = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const mins = u => parseInt(u.duration, 10) || 0;
const packOf = u => data.find(p => p.units.includes(u));   // 沒放進主題的單元回傳 undefined
const detach = u => { const p = packOf(u); if (p) p.units.splice(p.units.indexOf(u), 1); else loose.splice(loose.indexOf(u), 1); };
const newUnit = () => ({ title: '', duration: '90分鐘', levels: [], desc: '', sci_desc: '', skill_desc: '', sci: [], eng: [], tech: [], art: [], img: '' });
const gradeText = lv => { const g = LEVELS.filter(l => lv.includes(l.k)).flatMap(l => l.g); return g.length ? `${Math.min(...g)}~${Math.max(...g)}年級` : ''; };
const slotCount = p => (p.schedule || []).reduce((a, d) => a + d.items.length, 0);
const needsSchedule = p => p.published !== false && slotCount(p) === 0;
const allTags = k => { const m = new Map(); [...data.flatMap(p => p.units), ...loose].forEach(u => u[k].forEach(t => m.set(t, (m.get(t) || 0) + 1))); return [...m].sort((a, b) => b[1] - a[1]); };
// 課表一節存成「09:00 單元名稱」，沒有時間就只有內容
const parseSlot = s => { const m = String(s).match(/^(\d{1,2}:\d{2})\s+(.*)$/); return m ? { time: m[1].padStart(5, '0'), text: m[2] } : { time: '', text: String(s) }; };
const normTime = t => { t = String(t).trim().replace(/[：.]/g, ':'); let m = t.match(/^(\d{1,2}):(\d{2})$/) || t.match(/^(\d{1,2})(\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ':' + m[2] : ''; };
const joinSlot = (time, text) => (normTime(time) ? normTime(time) + ' ' : '') + text.trim();
const addMin = (t, m) => { const [h, mm] = t.split(':').map(Number), x = h * 60 + mm + m; return pad(Math.floor(x / 60) % 24) + ':' + pad(x % 60); };

function touch(msg) { dirty++; renderState(); renderList(); if (msg) toast(msg); }
function renderState() {
  const s = $('#state'); s.textContent = dirty ? '有未發布的變更' : '所有變更已發布'; s.classList.toggle('dirty', !!dirty);
  $('#publish').disabled = !dirty;
}
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.classList.toggle('bad', !!bad); t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), bad ? 4200 : 2400); }

/* ── 左側清單 ── */
function renderList() {
  const q = $('#search').value.trim();
  const units = data.flatMap(p => p.units.map(u => ({ u, p })));
  $('#n-theme').textContent = data.length; $('#n-unit').textContent = units.length + loose.length;
  document.querySelectorAll('.ltabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  let html = '';
  if (tab === 'theme') {
    html = ['初階', '進階'].map(type => {
      const ps = data.filter(p => p.type === type && (!q || p.title.includes(q))); if (!ps.length) return '';
      return `<p class="grp">${type === '初階' ? '單元主題課' : '5 天大型專案'}</p>` + ps.map(p => {
        const flags = [p.published === false ? '<span class="warn">下架中</span>' : '', needsSchedule(p) ? '<span class="warn">缺課表</span>' : '', !p.levels.length ? '<span class="warn">未選年級</span>' : ''].filter(Boolean).join('・');
        return `<button class="item" data-pack="${data.indexOf(p)}" aria-current="${view && view.kind === 'theme' && view.pack === p}" type="button">
        <span class="th" style="${p.intro_image ? `background-image:url('${IMG(p.intro_image)}')` : (p.type === '進階' ? 'background-color:var(--peach)' : '')}"></span>
        <span><b>${esc(p.title || '未命名主題課程')}</b><small>${esc(p.levels.join('・') || '—')}・${p.units.length} 個單元${flags ? '・' + flags : ''}</small></span></button>`; }).join('');
    }).join('');
  } else {
    const lo = loose.filter(u => !q || u.title.includes(q));
    html = (lo.length ? '<p class="grp">還沒放進主題（網站暫不顯示）</p>' + lo.map(u => `<button class="item u" data-loose="${loose.indexOf(u)}" aria-current="${view && view.unit === u}" type="button">
        <span class="th" style="${u.img ? `background-image:url('${IMG(u.img)}')` : ''}"></span><span><b>${esc(u.title || '未命名單元')}</b><small>${esc(u.duration)}${u.levels.length ? '・' + u.levels.join('・') : ''}</small></span></button>`).join('') : '') + data.map(p => {
      const us = p.units.filter(u => !q || u.title.includes(q)); if (!us.length) return '';
      return `<p class="grp">${esc(p.title || '未命名主題課程')}</p>` + us.map(u => `<button class="item u" data-pack="${data.indexOf(p)}" data-unit="${p.units.indexOf(u)}" aria-current="${view && view.unit === u}" type="button">
        <span class="th" style="${u.img ? `background-image:url('${IMG(u.img)}')` : ''}"></span><span><b>${esc(u.title || '未命名單元')}</b><small>${esc(u.duration)}${u.levels.length ? '・' + u.levels.join('・') : ''}</small></span></button>`).join('');
    }).join('');
  }
  $('#items').innerHTML = html || '<p class="hint" style="padding:8px">找不到符合的課程。</p>';
}

/* ── 右側：主題課程 ── */
function themeHtml(p) {
  const lvErr = triedPublish && !p.levels.length, scErr = triedPublish && needsSchedule(p);
  const titles = p.units.map(u => u.title).filter(Boolean);
  const scheduled = new Set((p.schedule || []).flatMap(d => d.items.map(s => parseSlot(s).text)));
  const missing = titles.filter(t => !scheduled.has(t));
  const total = p.units.reduce((a, u) => a + mins(u), 0);
  const others = data.filter(x => x !== p).flatMap(x => x.units.filter(u => u.title).map(u => ({ x, u })));
  return `
  <div class="ed-head"><div><span class="kind t">主題課程</span><h1 id="h-title">${esc(p.title || '未命名主題課程')}</h1></div></div>
  <fieldset><legend>基本資料</legend>
    <div class="row">
      <label class="f"><span>課程名稱</span><input id="p-title" value="${esc(p.title)}" placeholder="例如：小小天文學家"></label>
      <div class="f"><span>類型</span><div class="seg" id="p-type">${[['初階', '單元主題課'], ['進階', '5 天大型專案']].map(([v, n]) => `<button type="button" data-v="${v}" aria-pressed="${p.type === v}">${n}</button>`).join('')}</div></div>
    </div>
    <label class="f"><span>課程介紹（顯示在課程卡與課程頁）</span><textarea id="p-desc" rows="2">${esc(p.desc)}</textarea></label>
    <div class="cover">
      <label class="drop ${p.intro_image ? 'has' : ''}" style="${p.intro_image ? `background-image:url('${IMG(p.intro_image)}')` : ''}">點這裡上傳<br>封面照片<input type="file" accept="image/*" id="p-photo" aria-label="上傳封面照片"></label>
      <p class="hint" style="margin:0">建議橫式照片、寬度 1200px 以上。沒有上傳時，網站會用單元照片代替。</p>
    </div>
  </fieldset>
  <fieldset><legend>適合年級 <span class="req">必選</span><span class="hint">可複選，決定出現在「系統分齡」的哪一格</span></legend>
    <div class="lvls ${lvErr ? 'err' : ''}" id="p-levels">${LEVELS.map(l => `<button type="button" data-lv="${l.k}" aria-pressed="${p.levels.includes(l.k)}">${l.k}<small>${l.g[0]}~${l.g[1]} 年級</small></button>`).join('')}</div>
    <p class="hint ${lvErr ? 'err' : ''}">${p.levels.length ? `網站顯示「${esc(p.grades)}」` : '請至少選一個年級。'}</p>
  </fieldset>
  <fieldset><legend>包含的單元 <span class="hint">${p.units.length} 個・共 ${total} 分鐘</span></legend>
    <div class="ulist">${p.units.map((u, i) => `<div class="urow" data-i="${i}"><span class="u-no">${p.type === '進階' ? 'Project' : 'Unit ' + pad(i + 1)}</span>
      <button class="nm" type="button" data-act="open"><b>${esc(u.title || '未命名單元')}</b><small>${esc(u.duration)}・點一下編輯內容與標籤</small></button>
      <span class="tools"><button class="ic" type="button" data-act="up" aria-label="上移" ${i ? '' : 'disabled'}>↑</button><button class="ic" type="button" data-act="down" aria-label="下移" ${i < p.units.length - 1 ? '' : 'disabled'}>↓</button><button class="ic" type="button" data-act="del" aria-label="移除單元">✕</button></span></div>`).join('') || '<p class="hint">還沒有單元。</p>'}</div>
    <div class="addrow"><button class="dash" type="button" id="t-addunit">＋ 新增單元</button>
      ${others.length ? `<select id="t-copy" aria-label="從其他主題複製單元"><option value="">從其他主題複製一個單元…</option>${others.map((o, k) => `<option value="${k}">${esc(o.u.title)}（${esc(o.x.title)}）</option>`).join('')}</select>` : ''}</div>
  </fieldset>
  <fieldset><legend>課表 <span class="req">必填</span><span class="hint">每一欄是一天，每一列是一節</span></legend>
    <div class="auto">自動排課：每天 <input type="number" id="a-per" min="1" max="8" value="2" aria-label="每天幾節"> 節，從 <input id="a-start" value="09:00" maxlength="5" inputmode="numeric" aria-label="開始時間"> 開始，節與節之間休息 <input type="number" id="a-gap" min="0" max="120" step="5" value="10" aria-label="休息分鐘"> 分<button class="btn soft small" type="button" id="a-run">依單元順序排好</button></div>
    <div class="days" id="days">${(p.schedule || []).map((d, di) => `<div class="day" data-d="${di}">
      <div class="day-h"><span class="no">Day ${di + 1}</span><input data-dt value="${esc(d.day)}" placeholder="例如：星期三" aria-label="第 ${di + 1} 天名稱"></div>
      ${d.items.map((s, si) => { const x = parseSlot(s); return `<div class="slot" data-s="${si}"><input data-st value="${x.time}" placeholder="09:00" maxlength="5" inputmode="numeric" aria-label="開始時間"><input data-sx value="${esc(x.text)}" list="unit-names" placeholder="單元或活動" aria-label="內容"><button class="ic" type="button" data-act="rmslot" aria-label="刪除這一節">✕</button></div>`; }).join('')}
      <button class="dash" type="button" data-act="addslot">＋ 加一節</button>
      <button class="day-del" type="button" data-act="rmday">刪除這天</button></div>`).join('')}
      <button class="dash add-day" type="button" id="addday">＋ 加一天</button></div>
    <datalist id="unit-names">${titles.map(t => `<option value="${esc(t)}">`).join('')}<option value="休息"><option value="午餐"><option value="成果發表"></datalist>
    <div class="sum"><span>共 <b>${(p.schedule || []).length}</b> 天・<b>${slotCount(p)}</b> 節</span>
      ${scErr ? '<span class="err">發布前請先排好課表</span>' : missing.length ? `<span class="err">還沒排進課表：${missing.map(esc).join('、')}</span>` : titles.length ? '<span>所有單元都已排進課表 ✓</span>' : ''}</div>
  </fieldset>
  ${p.type === '進階' ? `<fieldset><legend>專案資訊</legend>
    <label class="f"><span>學習成果（一行一項，格式「標題｜說明」）</span><textarea id="p-outcomes" rows="3">${esc((p.outcomes || []).map(o => o.title + '｜' + o.desc).join('\n'))}</textarea></label>
    <label class="f"><span>課程需求（一行一項）</span><textarea id="p-req" rows="3">${esc((p.requirements || []).join('\n'))}</textarea></label>
  </fieldset>` : ''}
  <fieldset><legend>上架設定</legend>
    <div class="seg" id="p-pub"><button type="button" data-v="1" aria-pressed="${p.published !== false}">上架</button><button type="button" data-v="0" aria-pressed="${p.published === false}">下架（先不顯示）</button></div>
    <details class="more" style="margin-top:14px"><summary>進階設定</summary>
      <label class="f"><span>網址代稱（英文小寫與連字號，例如 little-astronomer；上線後請勿再改）</span><input id="p-slug" value="${esc(p.slug || '')}" placeholder="little-astronomer" autocapitalize="off"></label>
      <label class="f"><span>網站顯示的年級文字（選年級時會自動產生，需要時可以改）</span><input id="p-grades" value="${esc(p.grades)}"></label>
    </details>
  </fieldset>
  <div class="danger-zone"><span class="hint" style="margin:0">修改會先存成草稿，按右上角「發布到網站」才會上線。</span>
    <span id="delbox"><button class="btn danger small" id="del" type="button">刪除這個主題課程</button></span></div>`;
}

/* ── 右側：單元課程 ── */
function unitHtml(u) {
  const p = packOf(u);
  return `
  <div class="ed-head"><div><span class="kind u">單元課程</span><h1 id="h-title">${esc(u.title || '未命名單元')}</h1></div>
    ${p ? `<button class="back" type="button" id="to-pack">← 回到「${esc(p.title || '未命名主題課程')}」</button>` : ''}</div>
  <fieldset><legend>基本資料</legend>
    <div class="row">
      <label class="f"><span>單元名稱</span><input id="u-title" value="${esc(u.title)}" placeholder="例如：水火箭發射"></label>
      <label class="f"><span>放在哪個主題課程</span><select id="u-pack"><option value="-1" ${p ? '' : 'selected'}>先不選擇（網站暫不顯示）</option>${data.map((x, k) => `<option value="${k}" ${x === p ? 'selected' : ''}>${esc(x.title || '未命名主題課程')}</option>`).join('')}</select></label>
    </div>
    <div class="f"><span>上課時間</span><div class="durs" id="u-dur">${DURS.map(d => `<button type="button" data-dur="${d}" aria-pressed="${u.duration === d}">${d.replace('分鐘', ' 分鐘')}</button>`).join('')}<button type="button" data-dur="custom" aria-pressed="${!DURS.includes(u.duration)}">自填</button>${!DURS.includes(u.duration) ? `<label class="custom"><input id="u-mins" type="number" min="5" max="1440" step="5" value="${parseInt(u.duration, 10) || ''}" placeholder="120" aria-label="自填分鐘數"> 分鐘</label>` : ''}</div></div>
    <div class="f"><span>適合年級（可複選）</span><div class="lvls" id="u-levels">${LEVELS.map(l => `<button type="button" data-ulv="${l.k}" aria-pressed="${u.levels.includes(l.k)}">${l.k}<small>${l.g[0]}~${l.g[1]} 年級</small></button>`).join('')}</div></div>
  </fieldset>
  <fieldset><legend>內容</legend>
    <div class="cover" style="align-items:start">
      <div class="f"><span>單元照片</span><label class="drop ${u.img ? 'has' : ''}" style="${u.img ? `background-image:url('${IMG(u.img)}')` : ''}">上傳照片<input type="file" accept="image/*" id="u-photo" aria-label="上傳單元照片"></label></div>
      <label class="f"><span>單元說明</span><textarea id="u-desc" rows="4">${esc(u.desc)}</textarea></label>
    </div>
    <div class="row" style="grid-template-columns:1fr 1fr">
      <label class="f"><span>科學知識</span><input id="u-sci_desc" value="${esc(u.sci_desc)}"></label>
      <label class="f"><span>技能訓練</span><input id="u-skill_desc" value="${esc(u.skill_desc)}"></label>
    </div>
  </fieldset>
  <fieldset><legend>學習目標標籤 <span class="hint">決定出現在「課綱單元課程包」的哪些篩選；打字會提示已有的標籤，按 Enter 新增</span></legend>
    <div class="worlds">${WORLDS.map(([k, n]) => `<div class="wbox ${k}"><b>${n}</b><div class="chips">${u[k].map((t, ti) => `<span class="chip">${esc(t)}<button type="button" data-rm="${k}|${ti}" aria-label="移除 ${esc(t)}">✕</button></span>`).join('')}
      <span class="tagin"><input data-tag="${k}" placeholder="＋ 加標籤" autocomplete="off" aria-label="新增${n}標籤"></span></div></div>`).join('')}</div>
  </fieldset>
  <div class="danger-zone"><span class="hint" style="margin:0">修改會先存成草稿，按右上角「發布到網站」才會上線。</span>
    <span id="delbox"><button class="btn danger small" id="del" type="button">刪除這個單元</button></span></div>`;
}

function missingBanner() {
  const n = data.filter(p => p.published !== false && needsSchedule(p)).length;
  return triedPublish && n ? `<div class="auto" style="background:#FDECEA;color:var(--danger)">還有 ${n} 個主題課程沒有課表。<button class="btn soft small" type="button" id="bulk">全部先自動排好（每天 2 節）</button></div>` : '';
}
function renderEditor(keepScroll) {
  const y = scrollY;
  if (!view) { $('#editor').innerHTML = '<div class="empty">從左邊選一個課程，或按「新增」開始。</div>'; return; }
  $('#editor').innerHTML = missingBanner() + (view.kind === 'theme' ? themeHtml(view.pack) : unitHtml(view.unit));
  if (keepScroll) scrollTo(0, y);
}
function renderAll(keepScroll) { renderList(); renderEditor(keepScroll); renderState(); }
function openTheme(p) { view = { kind: 'theme', pack: p }; tab = 'theme'; renderAll(); if (innerWidth >= 860) scrollTo(0, 0); if (innerWidth < 860) $('#editor').scrollIntoView({ behavior: 'smooth' }); }
function openUnit(u) { view = { kind: 'unit', pack: packOf(u), unit: u }; tab = 'unit'; renderAll(); if (innerWidth >= 860) scrollTo(0, 0); if (innerWidth < 860) $('#editor').scrollIntoView({ behavior: 'smooth' }); }

/* ── 新增 ── */
$('#new-theme').addEventListener('click', () => {
  const n = Math.max(0, ...data.map(p => parseInt(String(p.id).replace(/\D/g, ''), 10) || 0)) + 1;
  const p = { id: 'p' + n, published: true, title: '', type: '初階', levels: [], grades: '', desc: '', intro_image: '', slug: '', outcomes: [], schedule: [], requirements: [], units: [] };
  data.push(p); openTheme(p); touch('已新增主題課程，先填名稱、選年級'); $('#p-title').focus();
});
$('#new-unit').addEventListener('click', () => {
  const u = newUnit(); loose.push(u); openUnit(u); touch('已新增單元，主題可以之後再選'); $('#u-title').focus();
});

/* ── 清單互動 ── */
$('#items').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  if (b.dataset.loose !== undefined) return openUnit(loose[+b.dataset.loose]);
  const p = data[+b.dataset.pack];
  b.dataset.unit !== undefined ? openUnit(p.units[+b.dataset.unit]) : openTheme(p);
});
document.querySelector('.ltabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderList(); } });
$('#search').addEventListener('input', renderList);

/* ── 文字輸入 ── */
$('#editor').addEventListener('input', e => {
  const el = e.target, v = view; if (!v) return;
  const lines = s => s.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  if (v.kind === 'theme') {
    const p = v.pack;
    if (el.id === 'p-title') { p.title = el.value; $('#h-title').textContent = el.value || '未命名主題課程'; return touch(); }
    if (el.id === 'p-desc') { p.desc = el.value; return touch(); }
    if (el.id === 'p-slug') { p.slug = el.value.toLowerCase().replace(/[^a-z0-9-]+/g, '-'); return touch(); }
    if (el.id === 'p-grades') { p.grades = el.value; return touch(); }
    if (el.id === 'p-outcomes') { p.outcomes = lines(el.value).map(l => { const [a, ...b] = l.split('｜'); return { title: a.trim(), desc: b.join('｜').trim() }; }); return touch(); }
    if (el.id === 'p-req') { p.requirements = lines(el.value); return touch(); }
    const day = el.closest('.day'); if (day) {
      const d = p.schedule[+day.dataset.d];
      if (el.dataset.dt !== undefined) { d.day = el.value; return touch(); }
      const slot = el.closest('.slot'); if (slot) { const si = +slot.dataset.s; d.items[si] = joinSlot(slot.querySelector('[data-st]').value, slot.querySelector('[data-sx]').value); return touch(); }
    }
  } else {
    const u = v.unit, f = el.id.replace(/^u-/, '');
    if (el.id === 'u-mins') { const n = parseInt(el.value, 10); u.duration = n > 0 ? n + '分鐘' : '自填'; return touch(); }
    if (['title', 'desc', 'sci_desc', 'skill_desc'].includes(f)) { u[f] = el.value; if (f === 'title') $('#h-title').textContent = el.value || '未命名單元'; return touch(); }
    if (el.dataset.tag) showSugg(el);
  }
});
// 課表的時間、內容改完才重畫（更新「還沒排進課表」提示）
$('#editor').addEventListener('change', e => {
  const el = e.target, v = view; if (!v) return;
  if (el.closest('.slot')) { renderEditor(true); return; }
  if (el.id === 'p-photo' && el.files[0]) uploadImage(el.files[0], url => { v.pack.intro_image = url; touch('封面照片已更新'); renderEditor(true); });
  if (el.id === 'u-photo' && el.files[0]) uploadImage(el.files[0], url => { v.unit.img = url; touch('單元照片已更新'); renderEditor(true); });
  if (el.id === 'u-pack') { const to = data[+el.value]; detach(v.unit); if (to) { to.units.push(v.unit); if (!v.unit.levels.length) v.unit.levels = [...to.levels]; } else loose.push(v.unit); v.pack = to; touch(to ? `已放進「${to.title || '未命名主題課程'}」` : '已改成先不放進主題'); renderAll(true); }
  if (el.id === 't-copy' && el.value !== '') {
    const others = data.filter(x => x !== v.pack).flatMap(x => x.units.filter(u => u.title).map(u => ({ x, u })));
    const src = others[+el.value].u, copy = JSON.parse(JSON.stringify(src)); delete copy.id;
    v.pack.units.push(copy); touch(`已複製「${src.title}」，可以再修改`); renderEditor(true);
  }
});

/* ── 按鈕 ── */
$('#editor').addEventListener('click', e => {
  const t = e.target, v = view; if (!v) return;
  if (t.closest('#bulk')) { let n = 0; data.forEach(p => { if (p.published !== false && needsSchedule(p)) { p.schedule = buildSchedule(p, 2, '09:00', 10); n++; } }); touch(`已幫 ${n} 個主題課程排好課表，請檢查一下再發布`); renderAll(true); return; }
  if (t.closest('#del')) { $('#delbox').innerHTML = `<span class="confirm">確定刪除「${esc((v.kind === 'theme' ? v.pack.title : v.unit.title) || '未命名')}」${v.kind === 'theme' ? `和裡面的 ${v.pack.units.length} 個單元` : ''}？<button class="btn danger small" id="delyes" type="button">刪除</button><button class="btn soft small" id="delno" type="button">取消</button></span>`; return; }
  if (t.closest('#delno')) { renderEditor(true); return; }
  if (t.closest('#delyes')) {
    if (v.kind === 'theme') { data.splice(data.indexOf(v.pack), 1); view = data[0] ? { kind: 'theme', pack: data[0] } : null; }
    else { const p = packOf(v.unit); detach(v.unit); view = p ? { kind: 'theme', pack: p } : (data[0] ? { kind: 'theme', pack: data[0] } : null); tab = p ? 'theme' : 'unit'; }
    touch('已刪除，發布後網站才會移除'); renderAll(); return;
  }
  if (v.kind === 'unit') {
    const u = v.unit;
    if (t.closest('#to-pack')) { openTheme(packOf(u)); return; }
    const d = t.closest('[data-dur]'); if (d) { if (d.dataset.dur === 'custom') { if (DURS.includes(u.duration)) u.duration = '自填'; renderEditor(true); $('#u-mins').focus(); } else { u.duration = d.dataset.dur; touch(); renderEditor(true); } return; }
    const ul = t.closest('[data-ulv]'); if (ul) { const k = ul.dataset.ulv; u.levels = u.levels.includes(k) ? u.levels.filter(x => x !== k) : LEVELS.map(l => l.k).filter(x => x === k || u.levels.includes(x)); touch(); renderEditor(true); return; }
    const rm = t.closest('[data-rm]'); if (rm) { const [k, ti] = rm.dataset.rm.split('|'); u[k].splice(+ti, 1); touch(); renderEditor(true); return; }
    const sg = t.closest('.sugg button'); if (sg) { addTag(sg.dataset.k, sg.dataset.v); return; }
    return;
  }
  const p = v.pack;
  const seg = t.closest('#p-type button'); if (seg) { p.type = seg.dataset.v; touch(); renderEditor(true); return; }
  const pub = t.closest('#p-pub button'); if (pub) { p.published = pub.dataset.v === '1'; touch(p.published ? '這個課程會顯示在網站上' : '發布後這個課程會從網站隱藏'); renderEditor(true); return; }
  const lv = t.closest('[data-lv]'); if (lv) { const k = lv.dataset.lv; p.levels = p.levels.includes(k) ? p.levels.filter(x => x !== k) : LEVELS.map(l => l.k).filter(x => x === k || p.levels.includes(x)); p.grades = gradeText(p.levels) || p.grades; touch(); renderEditor(true); return; }
  if (t.closest('#t-addunit')) { const u = newUnit(); u.levels = [...p.levels]; p.units.push(u); touch('已新增單元'); openUnit(u); $('#u-title').focus(); return; }
  if (t.closest('#a-run')) { autoSchedule(p); return; }
  if (t.closest('#addday')) { p.schedule.push({ day: `第 ${p.schedule.length + 1} 天`, items: [''] }); touch(); renderEditor(true); return; }
  const day = t.closest('.day'), act = t.closest('[data-act]')?.dataset.act;
  if (day && act) {
    const di = +day.dataset.d, d = p.schedule[di];
    if (act === 'addslot') { const last = d.items.length ? parseSlot(d.items[d.items.length - 1]) : null; d.items.push(last && last.time ? addMin(last.time, 100) + ' ' : ''); touch(); renderEditor(true); document.querySelector(`.day[data-d="${di}"] .slot:last-of-type [data-sx]`)?.focus(); return; }
    if (act === 'rmslot') { d.items.splice(+t.closest('.slot').dataset.s, 1); touch(); renderEditor(true); return; }
    if (act === 'rmday') { p.schedule.splice(di, 1); touch(); renderEditor(true); return; }
  }
  const row = t.closest('.urow'); if (row && act) {
    const i = +row.dataset.i;
    if (act === 'open') { openUnit(p.units[i]); return; }
    if (act === 'up' && i > 0) { [p.units[i - 1], p.units[i]] = [p.units[i], p.units[i - 1]]; touch(); renderEditor(true); return; }
    if (act === 'down' && i < p.units.length - 1) { [p.units[i + 1], p.units[i]] = [p.units[i], p.units[i + 1]]; touch(); renderEditor(true); return; }
    if (act === 'del') { const name = p.units[i].title || '未命名單元'; p.units.splice(i, 1); touch(`已移除「${name}」`); renderEditor(true); return; }
  }
});

function buildSchedule(p, per, start, gap) {
  const us = p.units.filter(u => u.title), days = [];
  for (let i = 0; i < us.length; i += per) {
    let t = start;
    days.push({ day: `第 ${days.length + 1} 天`, items: us.slice(i, i + per).map(u => { const s = t + ' ' + u.title; t = addMin(t, (mins(u) || 90) + gap); return s; }) });
  }
  return days;
}
function autoSchedule(p) {
  const per = Math.max(1, +$('#a-per').value || 2), start = normTime($('#a-start').value) || '09:00', gap = Math.max(0, +$('#a-gap').value || 0);
  const us = p.units.filter(u => u.title); if (!us.length) return toast('先新增單元再自動排課', true);
  const btn = $('#a-run');
  if (slotCount(p) && !btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = '會覆蓋目前課表，再按一次'; return; }
  const days = buildSchedule(p, per, start, gap);
  p.schedule = days; touch(`已排成 ${days.length} 天，可以再手動調整`); renderEditor(true);
}

/* ── 標籤 ── */
function showSugg(input) {
  const k = input.dataset.tag, q = input.value.trim(), box = input.parentElement;
  box.querySelector('.sugg')?.remove(); if (!q) return;
  const have = new Set(view.unit[k]);
  const list = allTags(k).filter(([t]) => t.includes(q) && !have.has(t)).slice(0, 8);
  box.insertAdjacentHTML('beforeend', `<div class="sugg">${list.map(([t, n]) => `<button type="button" data-k="${k}" data-v="${esc(t)}">${esc(t)}<small>${n} 個單元在用</small></button>`).join('')}<button type="button" data-k="${k}" data-v="${esc(q)}">＋ 新增「${esc(q)}」</button></div>`);
}
function addTag(k, val) {
  val = val.trim(); if (!val) return; const u = view.unit;
  if (!u[k].includes(val)) u[k].push(val);
  touch(); renderEditor(true); document.querySelector(`[data-tag="${k}"]`)?.focus();
}
$('#editor').addEventListener('keydown', e => {
  const el = e.target; if (!el.dataset.tag) return;
  if (e.key === 'Enter') { e.preventDefault(); if (!e.isComposing) addTag(el.dataset.tag, el.value); }
  if (e.key === 'Escape') { el.value = ''; el.parentElement.querySelector('.sugg')?.remove(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.tagin')) document.querySelectorAll('.sugg').forEach(s => s.remove()); });

/* ── 照片：先在瀏覽器縮到最寬 1600px，再存到雲端硬碟 ── */
function uploadImage(file, done) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.85);
      if (!IS_GAS) return done(url);
      toast('照片上傳中…');
      google.script.run.withSuccessHandler(done).withFailureHandler(e => toast('照片上傳失敗：' + e.message, true)).uploadPhoto(url, file.name.replace(/\.\w+$/, '') + '.jpg');
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ── 發布：上架的主題課程都要有年級和課表 ── */
$('#publish').addEventListener('click', () => {
  const bad = data.filter(p => p.published !== false && (!p.levels.length || needsSchedule(p)));
  if (bad.length) {
    triedPublish = true; tab = 'theme'; view = { kind: 'theme', pack: bad[0] }; renderAll();
    return toast(`還有 ${bad.length} 個主題課程缺年級或課表（清單裡紅字標示），補好再發布`, true);
  }
  data.forEach(p => { p.schedule = (p.schedule || []).map(d => ({ day: d.day.trim() || '未命名', items: d.items.map(s => s.trim()).filter(s => parseSlot(s).text.trim() && !/^\d{1,2}:\d{2}$/.test(s)) })).filter(d => d.items.length); });
  const btn = $('#publish'); btn.disabled = true; btn.textContent = '發布中…';
  const done = res => { dirty = 0; triedPublish = false; btn.textContent = '發布到網站'; renderAll(true); toast(res && res.units !== undefined ? `已發布：${res.packs} 個主題課程、${res.units} 個單元，網站約 5 分鐘內更新` : '已發布（預覽模式，資料不會寫到任何地方）'); };
  if (!IS_GAS) return setTimeout(done, 700);
  google.script.run.withSuccessHandler(done).withFailureHandler(e => { btn.disabled = false; btn.textContent = '發布到網站'; toast('發布失敗：' + e.message, true); }).saveCourses(data, loose);
});
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ── 開機 ── */
function boot(res) {
  const list = Array.isArray(res) ? res : (res && res.courses) || [];
  loose = ((res && res.loose) || []).map(u => Object.assign(newUnit(), u));
  data = list.map(p => {
    const q = Object.assign({ published: true, outcomes: [], schedule: [], requirements: [], intro_image: '', slug: '', levels: [] }, p);
    if (!q.levels.length) q.levels = OLD_GRADES[q.grades] ? [...OLD_GRADES[q.grades]] : [];
    q.units = (q.units || []).map(u => { const x = Object.assign(newUnit(), u); if (!x.levels.length) x.levels = [...q.levels]; return x; });
    return q;
  });
  view = data[0] ? { kind: 'theme', pack: data[0] } : null;
  renderAll();
}
if (IS_GAS) {
  $('#editor').innerHTML = '<div class="empty">正在讀取試算表裡的課程…</div>';
  google.script.run.withSuccessHandler(boot).withFailureHandler(err => { $('#editor').innerHTML = `<div class="empty" style="color:var(--danger)">讀取失敗：${esc(err.message)}</div>`; }).getCourses();
} else { $('#note').textContent = '預覽模式：可以實際操作，但資料不會寫到任何地方，重新整理會回到原本的資料。'; boot(JSON.parse(JSON.stringify(SAMPLE))); }
</script>
</body></html>
